<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D9161D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AdPulse OTS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#F6F4F3}img{max-width:100%}[hidden]{display:none!important}
/* Secure Guest Presentation Mode: zero dashboard/admin access */
body.guest-presentation .side,
body.guest-presentation .tabs,
body.guest-presentation .search,
body.guest-presentation .bell,
body.guest-presentation #modeNote,
body.guest-presentation .mbrand {
  display: none !important;
}
body.guest-presentation .app {
  grid-template-columns: 1fr !important;
}
body.guest-presentation .main {
  padding: 24px 20px 60px !important;
  max-width: 1280px;
  margin: 0 auto;
}

</style>
<title>AdPulse OOH Tracking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
.leaflet-container{font-family:var(--body);background:var(--bg2);border-radius:inherit}
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--ink)!important;border-radius:var(--r2)!important;box-shadow:var(--shadow)!important;padding:2px!important}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-content{margin:8px 10px!important;line-height:1.4!important}
.custom-map-pin{background:transparent;border:none}
:root{
  --bg:#F5F3FA;--bg2:#ECE7F8;--surface:#FFFFFF;--surface2:#F8F6FD;--ink:#17122B;--ink2:#48405F;--muted:#776F90;--line:#E2DCEF;
  --violet:#7C3AED;--pink:#E6398C;--cyan:#0A9FBC;--blue:#3B6FF6;
  --ok:#0E9F76;--bad:#E03656;--warn:#DB8F06;--orange:#EE7422;
  --okbg:#DDF6EC;--badbg:#FDE3E8;--warnbg:#FDF1D6;--orbg:#FDE8D8;
  --glass:rgba(255,255,255,.72);--shadow:0 10px 30px -12px rgba(76,40,160,.28);
  --grad:linear-gradient(120deg,var(--violet),var(--pink));
  --grad2:linear-gradient(120deg,var(--cyan),var(--blue));
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;--r2:12px;--sh1:#1b1238;--sh2:#3a1466;--sh3:#6d1650;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0C0917;--bg2:#141026;--surface:#191331;--surface2:#211a3e;--ink:#F3F0FC;--ink2:#C6BFE2;--muted:#8D86AC;--line:#2E2650;
  --violet:#A07BFF;--pink:#FF5FAA;--cyan:#27D3EE;--blue:#6B93FF;--ok:#34D399;--bad:#FB7189;--warn:#FBBF24;--orange:#FB923C;
  --okbg:rgba(52,211,153,.14);--badbg:rgba(251,113,137,.14);--warnbg:rgba(251,191,36,.14);--orbg:rgba(251,146,60,.14);
  --glass:rgba(25,19,49,.72);--shadow:0 12px 34px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0C0917;--bg2:#141026;--surface:#191331;--surface2:#211a3e;--ink:#F3F0FC;--ink2:#C6BFE2;--muted:#8D86AC;--line:#2E2650;
  --violet:#A07BFF;--pink:#FF5FAA;--cyan:#27D3EE;--blue:#6B93FF;--ok:#34D399;--bad:#FB7189;--warn:#FBBF24;--orange:#FB923C;
  --okbg:rgba(52,211,153,.14);--badbg:rgba(251,113,137,.14);--warnbg:rgba(251,191,36,.14);--orbg:rgba(251,146,60,.14);
  --glass:rgba(25,19,49,.72);--shadow:0 12px 34px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}

/* ambient mesh */
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mesh i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 22s ease-in-out infinite alternate}
.mesh i:nth-child(1){width:46vw;height:46vw;background:var(--violet);left:-12vw;top:-14vw}
.mesh i:nth-child(2){width:38vw;height:38vw;background:var(--pink);right:-10vw;top:10vh;animation-delay:-7s}
.mesh i:nth-child(3){width:34vw;height:34vw;background:var(--cyan);left:30vw;bottom:-18vw;animation-delay:-13s;opacity:.25}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.12)}}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 6px 12px color-mix(in srgb,var(--violet) 45%,transparent));transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
.brand b{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbrand{display:none;width:38px;height:38px;flex:none}
@media (max-width:860px){.mbrand{display:block}}
.logochip{background:#fff;border-radius:14px;padding:6px 10px;display:inline-grid;place-items:center;box-shadow:var(--shadow);flex:none}
.logochip img{display:block;height:60px;width:auto}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.th{border:2px solid var(--line);border-radius:16px;padding:0;background:var(--surface);cursor:pointer;text-align:left;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.th:hover{transform:translateY(-3px)}
.th.on{border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 20%,transparent)}
.th .pv{height:74px;position:relative;overflow:hidden}
.th .pv i{position:absolute;border-radius:50%;filter:blur(10px);opacity:.9}
.th .pv u{position:absolute;left:10px;bottom:10px;height:14px;width:60%;border-radius:7px}
.th .sw{display:flex;gap:4px;padding:10px 10px 0}
.th .sw span{width:18px;height:18px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
.th b{display:block;padding:6px 10px 0;font-size:13px}
.th small{display:block;padding:0 10px 10px;color:var(--muted);font-size:11.5px}
.logobox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:-.03em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:600;position:relative;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{color:var(--ink);background:var(--surface)}
.nav a.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
.nav svg{width:20px;height:20px;flex:none}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.main{min-width:0;padding-inline:28px;padding-block:22px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:800;flex:1;min-width:200px}
.top h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:220px;color:var(--muted);cursor:pointer}
.chipnote{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:700}

/* bottom tabs */
.tabs{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-inline:16px;padding-block:14px 110px}
  .top h1{font-size:24px}
  .search{min-width:0;flex:0 0 auto;padding:10px}
  .search span{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--glass);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:12px;min-height:52px;justify-content:center}
  .tabs a.on{color:var(--violet)}
  .tabs a svg{width:22px;height:22px}
  .tabs a.cap{color:#fff}
  .tabs a.cap span.ball{width:56px;height:56px;margin-top:-26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 24px -8px var(--pink);border:4px solid var(--bg)}
  .tabs a.cap em{color:var(--ink2);font-style:normal}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:42px;transition:transform .12s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px var(--pink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.cy{background:var(--grad2);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-available{background:var(--okbg);color:var(--ok)}
.st-booked{background:var(--badbg);color:var(--bad)}
.st-maintenance{background:var(--warnbg);color:var(--warn)}
.st-expiring{background:var(--orbg);color:var(--orange)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.tag.sample{background:var(--warnbg);color:var(--warn);border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink2)}
.in{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;font-size:15px;font-weight:500;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 18%,transparent)}
textarea.in{min-height:80px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;min-height:38px;transition:all .18s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.st.on.available{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.st.on.booked{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.st.on.maintenance{background:var(--warn);border-color:var(--warn);color:#fff}

/* entrance */
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}}
.view{animation:pagein .35s ease both}
@keyframes pagein{from{opacity:.4;transform:translateX(10px)}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi .n{font-family:var(--display);font-size:38px;font-weight:800;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.kpi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.kpi .ic svg{width:19px;height:19px}
.kpi small{color:var(--muted);font-weight:600;font-size:12px}
.kpi::after{content:"";position:absolute;right:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.12}

.dash{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
@media (max-width:1000px){.dash{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-h h2{font-size:18px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px;font-weight:600}
.bar-row .track{height:14px;border-radius:7px;background:var(--surface2);display:flex;overflow:hidden}
.bar-row .track i{display:block;height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.feed .it:last-child{border:0}
.feed img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}
.feed b{font-weight:700}
.feed small{color:var(--muted)}
.alert{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--orbg);color:var(--ink);font-weight:600;font-size:13px}
.alert.b{background:var(--warnbg)}
.alert svg{width:18px;height:18px;color:var(--orange);flex:none}

/* map */
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.mapwrap svg.map{display:block;width:100%;height:auto}
.pin{cursor:pointer;animation:drop .6s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes drop{from{transform:translateY(-30px) scale(.4);opacity:0}}
.pin:hover .pb{transform:scale(1.25)}
.pb{transition:transform .2s;transform-box:fill-box;transform-origin:50% 100%}
.mappop{position:absolute;width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:5;animation:rise .25s ease both}
.mappop img{width:100%;height:120px;object-fit:cover;display:block}
.mappop .b{padding:10px 12px}

/* sites */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{min-height:40px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;max-width:170px}
.filters select.set{border-color:var(--violet);color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,var(--surface))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.scard{overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;position:relative}
.scard:hover{transform:translateY(-4px) rotate(-.3deg);box-shadow:0 20px 40px -18px color-mix(in srgb,var(--violet) 45%,transparent)}
.scard .ph{aspect-ratio:16/10;background:var(--surface2);position:relative;overflow:hidden}
.scard .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.scard:hover .ph img{transform:scale(1.06)}
.scard .ph .pill{position:absolute;left:10px;top:10px;backdrop-filter:blur(6px)}
.scard .ph .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.scard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.scard .code{font-family:var(--mono);font-size:12px;color:var(--violet);font-weight:700}
.scard h3{font-size:16px;font-weight:700;font-family:var(--body);letter-spacing:0}
.scard .dir{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.scard .meta{display:flex;gap:6px;flex-wrap:wrap}
.scard .ck{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.9);display:grid;place-items:center;border:2px solid transparent;z-index:2;color:#17122B}
.scard.sel{outline:3px solid var(--violet);outline-offset:-3px}
.scard.sel .ck{background:var(--violet);color:#fff}
.tblwrap{overflow-x:auto;border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;min-width:820px;background:var(--surface)}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);background:var(--surface2)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.t tr:hover td{background:var(--surface2);cursor:pointer}
table.t img{width:56px;height:38px;object-fit:cover;border-radius:7px;display:block}
.bulk{position:sticky;bottom:12px;z-index:30;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 20px 40px -14px rgba(0,0,0,.5);animation:rise .3s ease both}
.bulk .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.bulk select{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);border-radius:10px;padding:8px}
.bulk select option{color:#17122B}
@media (max-width:860px){.bulk{bottom:92px}}

/* capture */
.cap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media (max-width:900px){.cap{grid-template-columns:1fr}}
.shutter{position:relative;border-radius:24px;padding:26px;background:linear-gradient(145deg,var(--sh1),var(--sh2) 55%,var(--sh3));color:#fff;overflow:hidden;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.shutter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 40px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 40px)}
.shutter h2{font-size:26px;position:relative}
.shutter p{opacity:.8;position:relative;margin:0;max-width:40ch}
.shbtn{position:relative;align-self:center;width:112px;height:112px;border-radius:50%;border:5px solid rgba(255,255,255,.9);display:grid;place-items:center;cursor:pointer;background:transparent}
.shbtn span{width:84px;height:84px;border-radius:50%;background:var(--grad);display:grid;place-items:center;transition:transform .15s;box-shadow:0 0 0 0 rgba(255,95,170,.6);animation:pulse 2.4s infinite}
.shbtn:active span{transform:scale(.88)}
.shbtn svg{width:34px;height:34px}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(255,95,170,0)}100%{box-shadow:0 0 0 0 rgba(255,95,170,0)}}
.shutter .alt{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.shutter .alt label{font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.thumb{position:relative;border-radius:12px;overflow:hidden;background:var(--surface2);animation:rise .35s ease both}
.thumb img,.thumb video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.thumb .vd{position:absolute;left:6px;bottom:40px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--bad);color:#fff}
.gallery video{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#000}
.feed video{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:#000}
.vidbadge{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.shutter .alt label.rec{background:rgba(255,95,170,.3)}
.thumb select{width:100%;border:0;border-top:1px solid var(--line);padding:7px;font-size:12px;font-weight:700;background:var(--surface)}
.thumb .x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:8px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.thumb .gps{position:absolute;left:6px;top:6px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--ok);color:#fff}
.flash{position:fixed;inset:0;background:#fff;z-index:100;pointer-events:none;animation:flash .5s ease forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.done{position:fixed;inset:0;display:grid;place-items:center;z-index:99;pointer-events:none}
.done div{background:var(--surface);border-radius:24px;padding:28px 34px;text-align:center;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.done svg{width:74px;height:74px}
.done circle{stroke-dasharray:200;stroke-dashoffset:200;animation:draw .6s .1s forwards}
.done path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.queue{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warnbg);font-weight:600;margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.step-h b{width:26px;height:26px;border-radius:8px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px}
.step-h:first-child{margin-top:0}

/* campaigns */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.camp{overflow:hidden}
.camp .hd{padding:18px;color:#fff;position:relative;overflow:hidden;background:var(--cc)}
.camp .hd::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.13)}
.camp .hd h3{font-size:21px;position:relative}
.camp .hd small{opacity:.85;font-weight:600;position:relative}
.camp .bd{padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px}
.ring circle{fill:none;stroke-width:9}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.camp .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px;color:var(--muted);font-weight:600}
.camp .stats b{display:block;color:var(--ink);font-size:18px;font-family:var(--display)}
.camp .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(12,9,23,.5);backdrop-filter:blur(3px);z-index:60;animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:61;overflow-y:auto;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);animation:slidein .35s cubic-bezier(.2,.8,.2,1) both;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.drawer .dh{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:14px 18px;background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.drawer .db{padding:18px;display:flex;flex-direction:column;gap:16px}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.gallery figure{margin:0;flex:0 0 84%;scroll-snap-align:start;position:relative;border-radius:14px;overflow:hidden;background:var(--surface2)}
.gallery img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.gallery .pdel{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:10px;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px);transition:background .2s}
.gallery .pdel:hover{background:var(--bad)}
.gallery .pdel svg{width:17px;height:17px}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:11.5px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--bg);border-radius:22px;z-index:62;box-shadow:var(--shadow);animation:pop .3s cubic-bezier(.3,1.3,.5,1) both}
.modal .mh{padding:18px 20px 0;display:flex;align-items:center;gap:10px}
.modal .mb{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.picklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.picklist label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.picklist label:last-child{border:0}
.picklist input{width:18px;height:18px;accent-color:var(--violet)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px 12px 18px;display:flex;gap:14px;align-items:center;font-weight:600;box-shadow:0 20px 40px -14px rgba(0,0,0,.5);animation:rise .3s ease both;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer}
@media (max-width:860px){.toast{bottom:96px}}

/* studio */
.studio{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:1100px){.studio{grid-template-columns:1fr}}
.cfg{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
@media (max-width:1100px){.cfg{position:static}}
.tpls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tpl{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;background:var(--surface);text-align:left}
.tpl.on{border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 18%,transparent)}
.tpl i{display:block;aspect-ratio:16/9}
.tpl span{display:block;font-size:11px;font-weight:700;padding:5px 7px}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggles label{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:6px 4px;cursor:pointer}
.toggles input{width:17px;height:17px;accent-color:var(--violet)}
.slides{display:flex;flex-direction:column;gap:14px}
.sl{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;animation:rise .4s ease both}
.sl .num{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px}
.sl .num b{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sl .num button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.sl .num button svg{width:15px;height:15px}
.sl.hid .slide{opacity:.35;filter:grayscale(1)}
.sl.dragging{opacity:.5}
.sl.over .slide{outline:3px dashed var(--violet);outline-offset:3px}
.slwrap{display:flex;flex-direction:column;gap:8px;min-width:0}
.slide{position:relative;aspect-ratio:16/9;width:100%;container-type:inline-size;border-radius:10px;overflow:hidden;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);background:#fff}
.slide .o{position:absolute;overflow:hidden;white-space:pre-wrap;line-height:1.18}
.slide .o img{width:100%;height:100%;object-fit:cover;display:block}
.slide [contenteditable]{outline:none;border-radius:3px}
.slide [contenteditable]:hover{box-shadow:0 0 0 1.5px rgba(124,58,237,.6)}
.slide [contenteditable]:focus{box-shadow:0 0 0 2px #7C3AED;background:rgba(124,58,237,.06)}
.sltools{display:flex;gap:6px;flex-wrap:wrap}
.gen{display:flex;flex-direction:column;gap:10px;padding:18px}
.gen .stp{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--muted);transition:color .3s}
.gen .stp i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .3s}
.gen .stp.on{color:var(--ink)}
.gen .stp.on i{border-color:var(--violet);border-top-color:transparent;animation:spin .8s linear infinite}
.gen .stp.ok{color:var(--ink)}
.gen .stp.ok i{background:var(--ok);border-color:var(--ok);animation:none}
.gen .stp.ok i::after{content:"✓";color:#fff;font-size:12px;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{display:flex;justify-content:center;height:70px;position:relative}
.fly i{position:absolute;width:70px;height:40px;border-radius:6px;background:var(--grad);box-shadow:var(--shadow);animation:flyin 1.4s cubic-bezier(.2,.8,.2,1) infinite}
.fly i:nth-child(2){animation-delay:.2s;background:var(--grad2)}.fly i:nth-child(3){animation-delay:.4s}
@keyframes flyin{0%{transform:translate(-120px,-20px) rotate(-18deg);opacity:0}40%{opacity:1}100%{transform:translate(0,14px) rotate(0);opacity:.2}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:var(--violet);opacity:.7}
.empty h3{color:var(--ink);font-size:18px;margin:10px 0 6px}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--surface2),color-mix(in srgb,var(--violet) 10%,var(--surface2)),var(--surface2));background-size:200% 100%;animation:shim 1.3s linear infinite;min-height:220px}
@keyframes shim{to{background-position:-200% 0}}
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:70;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;animation:pop .25s ease both}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent}
.pal input:focus{outline:none}
.pal .res{max-height:50vh;overflow:auto}
.pal .res button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:transparent;padding:11px 18px;cursor:pointer}
.pal .res button:hover,.pal .res button.on{background:var(--surface2)}
/* traffic */
.tb{display:inline-flex;align-items:flex-end;gap:2px;margin-right:6px;vertical-align:-1px}
.tb i{width:3px;border-radius:2px;background:currentColor;opacity:.25}
.tb i.on{opacity:1}
.tag.traf{border-color:transparent;display:inline-flex;align-items:center}
.t-vhigh{background:color-mix(in srgb,var(--violet) 14%,var(--surface));color:var(--violet)}
.t-high{background:color-mix(in srgb,var(--pink) 16%,var(--surface));color:color-mix(in srgb,var(--pink) 80%,var(--ink))}
.t-med{background:color-mix(in srgb,var(--cyan) 14%,var(--surface));color:var(--cyan)}
.t-low{background:var(--surface2);color:var(--muted)}
.tbox{grid-column:1/-1;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 6%,var(--surface)),color-mix(in srgb,var(--cyan) 6%,var(--surface)))}
.tbox h4{margin:0;font-family:var(--display);font-size:15px;display:flex;gap:8px;align-items:center}
.tbox .lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbox .lvl button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink2);min-height:64px;transition:all .18s}
.tbox .lvl button .tb{margin:0}
.tbox .lvl button.on{border-color:var(--violet);color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,var(--surface));transform:translateY(-2px)}
.ots{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg)}
.ots b{font-family:var(--display);font-size:28px;line-height:1}
.ots small{opacity:.75;font-size:11.5px;line-height:1.35}
.gpsline{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--muted)}
.gpsline .ok{color:var(--ok)}
.help ol{margin:0;padding-left:20px;display:grid;gap:8px}
.help li{line-height:1.45}
/* mobile polish */
.fbtn{display:none}
.howd summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.howd summary::-webkit-details-marker{display:none}
.howd summary::after{content:"▾";color:var(--muted)}
.howd[open] summary::after{content:"▴"}
.cfgt{display:none}
button,a,label,.chip{-webkit-tap-highlight-color:transparent}
@media (max-width:860px){
  .top{gap:10px}
  .top h1{flex:1 1 calc(100% - 52px);min-width:0;font-size:24px}
  .top .hm{display:none}
  .top .btn.pri{flex:1;justify-content:center}
  .kpis{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpis .kpi{flex:0 0 40%;scroll-snap-align:start;padding:14px}
  .kpi .n{font-size:30px}
  .filters{gap:8px}
  .filters #fq{max-width:none!important;flex:1 1 60%}
  .fbtn{display:inline-flex}
  .fsel{display:none;width:100%;gap:8px;flex-wrap:wrap}
  .fsel.open{display:flex}
  .fsel select{flex:1 1 45%;max-width:none}
  .filters .seg{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
  .cfgt{display:flex;width:100%;justify-content:space-between}
  .cfg:not(.open) .setc{display:none}
  .studio .slides{gap:18px}
  .sl{grid-template-columns:34px 1fr;gap:8px}
  .drawer .db{padding:14px}
  .fgrid{gap:12px}
  .tbox .lvl button{min-height:58px;font-size:11.5px}
  .camp .bd{grid-template-columns:auto 1fr}
}
.fsel{display:contents}
@media (max-width:860px){.fsel{display:none}.fsel.open{display:flex}}
/* site agent */
#siteAgent:empty{display:none}
.sag{border-radius:18px;padding:14px;margin-bottom:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 10%,var(--surface)),color-mix(in srgb,var(--cyan) 10%,var(--surface)));border:1px solid color-mix(in srgb,var(--violet) 25%,var(--line));display:grid;gap:12px;animation:rise .4s ease both}
.sag .hd{display:flex;gap:10px;align-items:center}
.sag .hd .bot{width:36px;height:36px;border-radius:12px}
.sag .hd .bot svg{width:20px;height:20px}
.sag .hd b{font-family:var(--display);font-size:16px;display:block}
.sag .hd small{color:var(--muted);font-weight:600;font-size:12px}
.mcard{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center}
.mcard img{width:96px;height:72px;object-fit:cover;border-radius:10px;display:block}
.mcard .code{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--violet)}
.mcard h4{margin:2px 0;font-size:15px}
.mcard small{color:var(--ink2);font-size:12px;display:block}
.conf{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.conf.hi{background:var(--okbg);color:var(--ok)}.conf.md{background:var(--warnbg);color:var(--warn)}.conf.lo{background:var(--surface2);color:var(--muted)}
.aires{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.aires .r{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:13px}
.aires .r span:first-child{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.aires .r b{font-weight:700}
.aifield{position:relative;border-radius:14px;outline:2px dashed color-mix(in srgb,var(--violet) 70%,transparent);outline-offset:4px}
.aifield::after{content:"AI";position:absolute;top:-10px;right:-6px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--violet);color:#fff;letter-spacing:.05em}
.scanbar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.scanbar i{display:block;height:100%;width:35%;background:var(--grad);animation:scanx 1.2s ease-in-out infinite}
@keyframes scanx{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.oldinfo:empty{display:none}
/* bell + agent */
.bell{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:none}
.bell svg{width:20px;height:20px}
.bell b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.bell.ring svg{animation:ring 1s ease 2}
@keyframes ring{10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}50%{transform:none}}
.more{display:none}
@media (max-width:860px){.more{display:inline-flex}}
#agentPop{position:fixed;right:20px;bottom:20px;z-index:80;width:min(400px,calc(100% - 32px))}
@media (max-width:860px){#agentPop{right:16px;bottom:96px}}
.apop{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 60px -20px rgba(40,10,90,.5);overflow:hidden;animation:apin .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes apin{from{transform:translateY(40px) scale(.92);opacity:0}}
.ahd{display:flex;gap:12px;align-items:center;padding:14px 14px 12px 16px;background:linear-gradient(120deg,color-mix(in srgb,var(--violet) 14%,var(--surface)),color-mix(in srgb,var(--pink) 12%,var(--surface)))}
.ahd b{display:block;font-family:var(--display);font-size:16px}
.ahd small{color:var(--muted);font-weight:600}
.bot{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;position:relative;flex:none}
.bot svg{width:22px;height:22px}
.bot::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:2px solid var(--pink);opacity:0;animation:radar 2s ease-out infinite}
@keyframes radar{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.alist{max-height:min(56vh,440px);overflow:auto}
.al{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);animation:rise .4s ease both}
.al:nth-child(2){animation-delay:.08s}.al:nth-child(3){animation-delay:.16s}.al:nth-child(n+4){animation-delay:.24s}
.al>i{border-radius:4px;background:var(--cyan)}
.al.warn>i{background:var(--orange)}.al.critical>i{background:var(--bad)}
.al b{font-weight:800;display:block}
.al small{color:var(--ink2);font-size:12.5px;display:block;margin-top:2px}
.aft{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface2)}
.aft small{color:var(--muted);font-weight:600}
.scan{padding:26px;text-align:center;color:var(--muted);font-weight:600}
.scan .rad{width:70px;height:70px;margin:0 auto 12px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,var(--pink));animation:spin 1s linear infinite;-webkit-mask:radial-gradient(circle,transparent 28%,#000 30%);mask:radial-gradient(circle,transparent 28%,#000 30%)}
/* dates + timeline */
.dates{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.dates svg{width:14px;height:14px;color:var(--muted)}
.tl{padding:0 18px 14px}
.tlbar{height:8px;border-radius:4px;background:var(--surface2);position:relative}
.tlbar i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.tlbar b{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.tlx{margin-top:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
/* clients + portal */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.how div{padding:14px;border-radius:14px;background:var(--surface);border:1px dashed var(--line)}
.how b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--grad);color:#fff;font-size:12px;margin-bottom:6px}
.how p{margin:0;font-size:13px;color:var(--ink2)}
.av{width:42px;height:42px;border-radius:13px;background:var(--grad2);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;flex:none}
.req{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--cyan) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--cyan) 30%,var(--line));flex-wrap:wrap}
.pvbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);margin-bottom:16px;font-weight:600}
.pvbar svg{width:18px;height:18px}
.pvbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.phero{position:relative;overflow:hidden;border-radius:24px;padding:26px;color:#fff;background:linear-gradient(125deg,var(--pc),color-mix(in srgb,var(--pc) 45%,#E6398C));display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
.phero::before{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12)}
.phero::after{content:"";position:absolute;right:120px;bottom:-120px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.phero h2{font-size:34px;font-weight:800;position:relative}
.phero .sub{opacity:.85;font-weight:600;position:relative}
.phero .big{position:relative;text-align:right}
.phero .big b{font-family:var(--display);font-size:64px;line-height:.9;display:block}
.phero .big span{font-weight:700;opacity:.85}
.phero .tlbar{background:rgba(255,255,255,.25);margin-top:18px}
.phero .tlbar i{background:#fff}
.phero .tlbar b{border-color:#fff;background:var(--pc)}
.phero .tlx{color:rgba(255,255,255,.85)}
.phero>*{position:relative;z-index:1}
@media (max-width:620px){.phero{grid-template-columns:1fr}.phero .big{text-align:left}.phero h2{font-size:26px}}
.pgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}
@media (max-width:1000px){.pgrid{grid-template-columns:1fr}}
.gate{max-width:520px;margin:6vh auto 0;text-align:center}
.gate .bot{width:72px;height:72px;margin:0 auto 16px;border-radius:22px}
.gate .bot svg{width:36px;height:36px}
.sheet a{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700}
.sheet a svg{width:20px;height:20px;color:var(--violet)}
body.client .tabs{display:none}
@media (max-width:860px){body.client .main{padding-block:14px 40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

  const [d,a,dl,u,sm]=await Promise.all([claude.use("db"),claude.use("assets"),claude.use("downloads"),claude.use("user"),claude.use("sample")]);
  db=d;assets=a;downloads=dl;user=u;sampleFn=sm;
  if(sampleFn)sampleFn.limits().then(l=>{sampleImg=l&&l.images||null;renderSiteAgent()}).catch(()=>{sampleImg=null});
  if(!db){startLocal();return}
  S.mode="live";
  if(user){try{[ME,CAN_ADMIN,CAN_WRITE]=await Promise.all([user.id(),user.canEdit(),user.can("data.write")])}catch(e){}}
  if(!CAN_ADMIN){
    if(/#(presentation|deck|campdeck):/i.test(location.hash)){
      startPresentationGuest();
      return;
    }
    startPortal();
    return;
  }
  ROLE="team";renderNav();go(location.hash.slice(1)||"dashboard",true);setTimeout(loadQueue,2500);
  db.collection("sites").onSnapshot(q=>{S.sites=q.docs.map(x=>({id:x.id,...x.data()}));S.loaded.sites=true;changed()},e=>{toast("Couldn't load sites: "+e.message)});
  db.collection("campaigns").onSnapshot(q=>{S.campaigns=q.docs.map(x=>({id:x.id,...x.data()}));S.loaded.campaigns=true;changed()});
  db.collection("decks").onSnapshot(q=>{S.decks=q.docs.map(x=>({id:x.id,...x.data()}));render()});
  db.doc("settings/brand").onSnapshot(x=>{if(x.exists)S.settings={...S.settings,...x.data()};applyTheme();changed()});
  db.collection("clients").onSnapshot(q=>{S.clients=q.docs.map(x=>({id:x.id,...x.data()}));S.loaded.clients=true;changed()},()=>{});
  db.collection("requests").onSnapshot(q=>{S.requests=q.docs.map(x=>({id:x.id,...x.data()}));changed()},()=>{});
  db.collection("portal").onSnapshot(q=>{portals=Object.fromEntries(q.docs.map(x=>[x.id,x.data()]));S.loaded.portals=true;if(route==="clients")render();schedSync()},()=>{});

  $("#tabNav").innerHTML=t.map(([k,l,i])=>k==="capture"?`<a href="#capture" class="cap" data-r="capture"><span class="ball">${ICON.cam}</span><em>${l}</em></a>`:`<a href="#${k}" data-r="${k}">${ICON[i]}${l}</a>`).join("");

function go(r,silent){
  if(ROLE==="pending")return;
  if(ROLE==="guest"){
    route = "studio";
    if(r.startsWith("presentation:")||r.startsWith("deck:")){
      const id=decodeURIComponent(r.split(":")[1]);
      db.doc("decks/"+id).get().then(snap=>{
        if(snap && snap.exists) Studio.load({id: snap.id, ...snap.data()});
      });
    }
    $("[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r==="studio"));
    if(!silent)window.scrollTo({top:0});
    render(true);
    return;
  }
  if(r.startsWith("presentation:")||r.startsWith("deck:")){
    const id=decodeURIComponent(r.split(":")[1]);
    const d=S.decks.find(x=>x.id===id);
    if(d)Studio.load(d);
    else{const c=S.campaigns.find(x=>x.id===id);if(c)Studio.open({type:"campaign",campaignId:c.id});else Studio.open({type:"filter"});}
    r="studio";
  } else if(r.startsWith("campdeck:")){
    const id=decodeURIComponent(r.split(":")[1]);
    Studio.open({type:"campaign",campaignId:id});
    r="studio";
  }
  const ok=ROLE==="client"?["portal"]:[...NAV.map(n=>n[0]),"portal"];
  route=ok.includes(r)?r:(ROLE==="client"?"portal":"dashboard");
  $$("[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r===route));
  if(!silent)window.scrollTo({top:0});
  render(true);
}

  $$(".ring .fg").forEach(c=>requestAnimationFrame(()=>c.style.strokeDashoffset=c.dataset.off));
  if(route==="capture")initCapture();
  if(route==="studio")Studio.mount();
  if(route==="settings"&&CAN_ADMIN&&user&&user.members)loadTeamList();

    mountLeafletMap(curSites);

  if(route==="clients"&&user){const ids=[...new Set([...S.clients,...S.requests].map(c=>c.id).filter(i=>i&&i.startsWith("u_")))];if(ids.length)user.profiles(ids).then(ps=>$$("[data-uid]").forEach(el=>{const p=ps[el.dataset.uid];el.textContent=p?((p.name||"Signed-in person")+(p.email?" · "+p.email:"")+(p.guest?" · guest":"")):""}))}

/* ============ Map (Leaflet + OpenStreetMap) ============ */
let _leafletMap = null;
function mountLeafletMap(list){
  const el = document.getElementById("leafletMap");
  if(!el || typeof L === "undefined") return;
  if(_leafletMap){
    try{ _leafletMap.remove(); }catch(e){}
    _leafletMap = null;
  }
  const map = L.map(el, { scrollWheelZoom: false, attributionControl: false });
  _leafletMap = map;

  const streetLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  });

  const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri'
  });

  const labelLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    subdomains: 'abcd'
  });

  streetLayer.addTo(map);

  const baseMaps = {
    "🗺️ Street Map": streetLayer,
    "🛰️ 3D Satellite": satLayer
  };
  const overlayMaps = {
    "🏷️ Road Labels": labelLayer
  };
  L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

  map.on('baselayerchange', function(e) {
    if(e.name === "🛰️ 3D Satellite") {
      if(!map.hasLayer(labelLayer)) map.addLayer(labelLayer);
    }
  });

  const col = { available: "#0E9F76", booked: "#E03656", expiring: "#EE7422", maintenance: "#DB8F06" };
  const valid = (list || []).filter(s => s && s.lat && s.lng && isFinite(+s.lat) && isFinite(+s.lng));
  const markers = [];

  valid.forEach(s => {
    const st = effStatus(s);
    const c = col[st] || "#7C3AED";
    const icon = L.divIcon({
      className: "custom-map-pin",
      html: `<div style="width:24px;height:24px;background:${c};border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 6px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center"><div style="width:7px;height:7px;background:#fff;border-radius:50%"></div></div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 24],
      popupAnchor: [0, -24]
    });
    const m = L.marker([+s.lat, +s.lng], { icon });
    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.lat+','+s.lng)}&travelmode=driving`;
    const popHtml = `<div style="min-width:190px;max-width:250px;font-family:var(--body)">
      <img src="${esc(thumbOf(s))}" alt="" style="width:100%;height:100px;object-fit:cover;border-radius:6px;margin-bottom:6px" onerror="phFix(this)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <span class="mono" style="font-size:12px;font-weight:700;color:var(--violet)">${esc(s.code)}</span>
        <span class="pill st-${st}" style="font-size:10px;padding:2px 6px">${STATUS[st]}</span>
      </div>
      <div style="font-weight:700;font-size:13px;color:var(--ink);margin-bottom:2px">${esc(s.area)} · ${sizeOf(s)} ft</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${esc(s.from||"—")} → ${esc(s.towards||"—")}</div>
      ${s.traffic||s.vehiclesDay?`<div style="font-size:11px;color:var(--ink2);margin-bottom:6px">~${fmtK(otsOf(s))} OTS/day</div>`:""}
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn sm pri" data-act="site" data-id="${s.id}" style="flex:1;justify-content:center;padding:5px 0">Open site</button>
        <a class="btn sm cy" href="${navUrl}" target="_blank" rel="noopener" style="flex:1;justify-content:center;padding:5px 0;text-decoration:none" title="Start Live 3D Navigation">${ICON.pin}Navigate</a>
      </div>
    </div>`;
    m.bindPopup(popHtml, { maxWidth: 260 });
    m.addTo(map);
    markers.push(m);
  });

  if(markers.length){
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.15), { maxZoom: 15 });
  } else {
    map.setView([24.8607, 67.0011], 12);
  }

  setTimeout(() => { if(_leafletMap === map) map.invalidateSize(); }, 250);
}

function parseCoords(v){let m;

  if(m=v.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/))return[+m[1],+m[2]];
  if(m=v.match(/(\d{1,2})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NS])[\s,]+(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EW])/i)){const a=(+m[1]+m[2]/60+m[3]/3600)*(/s/i.test(m[4])?-1:1),b=(+m[5]+m[6]/60+m[7]/3600)*(/w/i.test(m[8])?-1:1);return[a,b]}
  if(m=v.match(/(-?\d{1,2}\.\d+)°?\s*([NS])?[\s,]+(-?\d{1,3}\.\d+)°?\s*([EW])?/i)){let a=+m[1],b=+m[3];if(/s/i.test(m[2]||""))a=-a;if(/w/i.test(m[4]||""))b=-b;if(Math.abs(a)<=90&&Math.abs(b)<=180)return[a,b]}
  return null}

async function shrink(file,max=1280){const i=await loadImg(URL.createObjectURL(file));const sc=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(i.naturalWidth*sc);c.height=Math.round(i.naturalHeight*sc);c.getContext("2d").drawImage(i,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))}

    await put("sites",job.site);
    if(camp&&!(camp.siteIds||[]).includes(job.site.id)){await put("campaigns",{...camp,siteIds:[...(camp.siteIds||[]),job.site.id]})}
    return true
  }catch(err){console.warn(err);return false}
}

/* minimal EXIF GPS reader */
async function exifGPS(file){
  const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<v.byteLength-4){const m=v.getUint16(o);const len=v.getUint16(o+2);if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10;const le=v.getUint16(t)===0x4949;const u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
    const ifd0=t+u32(t+4);let gpsOff=0;for(let i=0,n=u16(ifd0);i<n;i++){const e=ifd0+2+i*12;if(u16(e)===0x8825)gpsOff=t+u32(e+8)}if(!gpsOff)return null;
    const tags={};for(let i=0,n=u16(gpsOff);i<n;i++){const e=gpsOff+2+i*12,tag=u16(e),type=u16(e+2);if(tag===1||tag===3)tags[tag]=String.fromCharCode(v.getUint8(e+8));if((tag===2||tag===4)&&type===5){const p=t+u32(e+8);const r=k=>u32(p+k*8)/u32(p+k*8+4);tags[tag]=r(0)+r(1)/60+r(2)/3600}if(tag===0x11&&type===5){const p=t+u32(e+8);const dn=u32(p+4);if(dn)tags.h=u32(p)/dn}}
    if(tags[2]==null||tags[4]==null)return null;const la=tags[2]*(tags[1]==="S"?-1:1),lo=tags[4]*(tags[3]==="W"?-1:1);return(la||lo)?[la,lo,tags.h!=null&&isFinite(tags.h)?tags.h%360:null]:null}
    if((m&0xFF00)!==0xFF00)break;o+=2+len}return null
}

/* ============ Campaigns ============ */
function vCampaigns(){
  if(!S.loaded.campaigns)return pgTop("Campaigns","Loading…")+`<div class="camps">${'<div class="skel"></div>'.repeat(3)}</div>`;
  const list=S.campaigns.slice().sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||""));
  const body=list.length?`<div class="camps enter">${list.map(campCard).join("")}</div>`:`<div class="card">${emptyState("No campaigns yet","Create a campaign, add sites to it, and track proof-of-display photos.",`<button class="btn pri" data-act="newcamp">${ICON.plus}New campaign</button>`)}</div>`;
  return pgTop("Campaigns",`${list.length} campaign${list.length!==1?"s":""}`,`<button class="btn pri" data-act="newcamp">${ICON.plus}New campaign</button>`)+body;
}
function campCard(c){
  const sites=(c.siteIds||[]).map(id=>S.sites.find(s=>s.id===id)).filter(Boolean);
  const inRange=p=>p.campaignId===c.id||(c.startDate&&p.at>=c.startDate);
  const done=sites.filter(s=>(s.photos||[]).some(inRange)).length;const pct=sites.length?Math.round(done/sites.length*100):0;
  const C=2*Math.PI*36;const left=c.endDate?Math.ceil((new Date(c.endDate)-new Date(today()))/864e5):null;
  const areas=[...new Set(sites.map(s=>s.area))];
  return`<article class="card camp" style="--cc:linear-gradient(125deg,${c.color||"#7C3AED"},color-mix(in srgb,${c.color||"#7C3AED"} 55%,#E6398C))">
   <div class="hd"><small>${esc(c.client||"Client")}${c.sample?" · Sample":""}</small><h3>${esc(c.name)}</h3><small>${fmtDate(c.startDate)} → ${fmtDate(c.endDate)}</small></div>
   <div class="bd"><svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" stroke="var(--surface2)"/><circle class="fg" cx="42" cy="42" r="36" stroke="${c.color||"#7C3AED"}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct/100)}"/><text x="42" y="46" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="18" fill="var(--ink)">${pct}%</text></svg>
    <div class="stats"><div><b>${sites.length}</b>Sites</div><div><b>${done}/${sites.length}</b>Monitored</div><div><b>${(()=>{const o=sites.reduce((a,x)=>a+otsOf(x),0);return o?"~"+fmtK(o):areas.length})()}</b>${sites.some(x=>otsOf(x))?"Daily OTS":"Areas"}</div><div><b>${left==null?"—":left<0?"Ended":left}</b>${left!=null&&left>=0?"Days left":"Status"}</div></div></div>
   ${timeline(c)}
   <div style="padding:0 18px 12px;font-size:12px;color:var(--muted);font-weight:600">${areas.slice(0,5).map(esc).join(" · ")||"No sites added yet"}</div>
   <div class="ft"><button class="btn sm" data-act="campsites" data-id="${c.id}">View sites</button><button class="btn sm" data-act="editcamp" data-id="${c.id}">Edit</button><span class="sp"></span><button class="btn sm" data-act="sharecamp" data-id="${c.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;vertical-align:middle;margin-right:4px"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Share link</button><button class="btn sm pri" data-act="campdeck" data-id="${c.id}">${ICON.deck}Generate deck</button></div></article>`;
}
function timeline(c,big){if(!c.startDate||!c.endDate)return"";const tot=Math.max(1,daysTo(c.endDate)-daysTo(c.startDate));const el=Math.max(0,Math.min(1,-daysTo(c.startDate)/tot));const d=daysTo(c.endDate);
  const chip=d<0?`<span class="pill st-maintenance">Ended</span>`:daysTo(c.startDate)>0?`<span class="pill" style="background:var(--surface2);color:var(--ink2)">Starts ${dayWord(daysTo(c.startDate))}</span>`:d<=7?`<span class="pill st-expiring">${d===0?"Ends today":d+" day"+(d>1?"s":"")+" left"}</span>`:`<span class="pill st-available">Live</span>`;
  return`<div class="${big?"":"tl"}"><div class="tlbar"><i style="width:${el*100}%;background:${big?"#fff":c.color||"var(--violet)"}"></i><b style="left:${el*100}%"></b></div><div class="row tlx"><span>${fmtShort(c.startDate)}</span><span class="sp"></span>${big?"":chip}<span class="sp"></span><span>${fmtShort(c.endDate)}</span></div></div>`}

  $("#cColor").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;c.color=b.dataset.v;$$("#cColor .chip").forEach(x=>x.style.borderColor=x===b?"var(--ink)":"transparent")};
  $("#cPick").onchange=e=>{if(e.target.checked)ids.add(e.target.value);else ids.delete(e.target.value);$("#cCnt").textContent=ids.size+" selected"};

  $("#campForm").onsubmit=async e=>{e.preventDefault();const bookIt=$("#cBook").checked;const n={...c,name:$("#cName").value.trim(),client:$("#cClient").value.trim(),startDate:$("#cStart").value,endDate:$("#cEnd").value,siteIds:[...ids]};try{await put("campaigns",n);closeLayer();let msg=id?"Campaign saved":"Campaign created";
    if(bookIt&&n.startDate&&n.endDate){const brand=n.client||n.name;let b=0,k=0;for(const sid of n.siteIds){const s=S.sites.find(x=>x.id===sid);if(!s)continue;const clash=s.status==="booked"&&s.brand&&s.brand!==brand&&s.bookedTill&&s.bookedTill>=n.startDate&&(!s.bookedFrom||s.bookedFrom<=n.endDate);if(clash){k++;continue}if(s.status==="booked"&&s.brand===brand&&s.bookedFrom===n.startDate&&s.bookedTill===n.endDate)continue;await put("sites",{...s,status:"booked",brand,bookedFrom:n.startDate,bookedTill:n.endDate});b++}
      if(b)msg+=` · ${b} site${b>1?"s":""} booked ${fmtShort(n.startDate)} → ${fmtShort(n.endDate)}`;if(k)msg+=` · ${k} skipped (booked by another brand)`}
    toast(msg)}catch(err){toast("Couldn't save: "+err.message)}};
}

 active:false,cfg:null,

   if(s.type==="campaign"){const c=campOf(s.campaignId);list=(c?.siteIds||[]).map(id=>S.sites.find(x=>x.id===id)).filter(Boolean)}

   if(!c.title){const cp=c.source.type==="campaign"?campOf(c.source.campaignId):null;c.title=cp?cp.name:c.source.type==="filter"?`${c.source.area||"Karachi"} ${c.source.status==="available"?"Available ":""}Sites`:"Site Proposal"}

function summaryOps(c,t,sites){const st=k=>sites.filter(s=>effStatus(s)===k).length;const ar={};sites.forEach(s=>ar[s.area]=(ar[s.area]||0)+1);const rows=Object.entries(ar).sort((a,b)=>b[1]-a[1]).slice(0,8);const mx=Math.max(1,...rows.map(r=>r[1]));

 count(){return this.live().length},
 compute(){const out=[],T=today();const sitesOf=c=>(c.siteIds||[]).map(id=>S.sites.find(s=>s.id===id)).filter(Boolean);
  if(ROLE==="client"){
   for(const c of S.campaigns){const n=sitesOf(c).length;
    if(c.endDate){const d=daysTo(c.endDate);if(d>=0&&d<=7)out.push({id:`cend:${c.id}:${d}`,sev:d<=2?"critical":"warn",title:`Your campaign "${c.name}" ends ${dayWord(d)}`,body:`${n} site${n!==1?"s":""} · last day ${fmtDate(c.endDate)}. Contact your account manager to extend.`,acts:[["View campaign","portalcamp",c.id]]})}
    if(c.startDate){const d=daysTo(c.startDate);if(d>0&&d<=3)out.push({id:`cstart:${c.id}:${d}`,sev:"info",title:`"${c.name}" goes live ${dayWord(d)}`,body:`${n} sites are being prepared`,acts:[["View campaign","portalcamp",c.id]]})}}
   const seen=ls.get("sitesnap-seen","");if(!seen)ls.set("sitesnap-seen",new Date().toISOString());
   else{const fresh=S.sites.flatMap(s=>(s.photos||[]).map(p=>p.at)).filter(a=>a>seen).sort();if(fresh.length)out.push({id:`photos:${fresh[fresh.length-1]}`,sev:"info",title:`${fresh.length} new photo${fresh.length>1?"s":""} from the field`,body:"Your sites were checked and photographed since your last visit.",acts:[]})}
  }else{
   for(const c of S.campaigns){const sites=sitesOf(c);
    if(c.endDate){const d=daysTo(c.endDate);
     if(d>=0&&d<=7)out.push({id:`end:${c.id}:${d}`,sev:d<=2?"critical":"warn",title:`${c.name} ends ${dayWord(d)}`,body:`${c.client||"Client"} · ${sites.length} site${sites.length!==1?"s":""} · last day ${fmtDate(c.endDate)}. Time for the closing report and a renewal call.`,acts:[["Closing report","campdeck",c.id],["View sites","campsites",c.id]]});
     if(d<0&&d>=-7){const held=sites.filter(s=>s.status==="booked"&&s.bookedTill&&s.bookedTill<=c.endDate);if(held.length)out.push({id:`ended:${c.id}:${held.length}`,sev:"info",title:`${c.name} ended ${fmtDate(c.endDate)}`,body:`${held.length} site${held.length>1?"s are":" is"} still marked booked for it. Release them back to inventory?`,acts:[["Release sites","release",c.id]]})}}
    if(c.startDate){const d=daysTo(c.startDate);if(d>=0&&d<=3)out.push({id:`start:${c.id}:${d}`,sev:"info",title:`${c.name} goes live ${dayWord(d)}`,body:`${sites.length} sites. Capture mounting photos on day one.`,acts:[["Open capture","gocapture",""]]})}
    const live=c.startDate&&daysTo(c.startDate)<=0&&(!c.endDate||daysTo(c.endDate)>=0);
    if(live&&sites.length){const miss=sites.filter(s=>!(s.photos||[]).some(p=>(Date.now()-new Date(p.at))/864e5<=7));if(miss.length)out.push({id:`mon:${c.id}:${T}:${miss.length}`,sev:"warn",title:`${miss.length} of ${sites.length} sites need a monitoring photo`,body:`${c.name}: no photo in the last 7 days (${miss.slice(0,3).map(s=>s.code).join(", ")}${miss.length>3?"…":""})`,acts:[["Open capture","gocapture",""]]})}}
   const inCamp=s=>S.campaigns.some(c=>(c.siteIds||[]).includes(s.id)&&c.endDate===s.bookedTill);
   const exp=S.sites.filter(s=>effStatus(s)==="expiring"&&!inCamp(s));
   if(exp.length)out.push({id:`exp:${exp.map(s=>s.id).join(",")}:${T}`,sev:"warn",title:`${exp.length} site booking${exp.length>1?"s end":" ends"} within 14 days`,body:exp.slice(0,3).map(s=>`${s.code} (${s.brand||"—"}, ${fmtShort(s.bookedTill)})`).join(" · ")+(exp.length>3?" …":""),acts:[["View sites","expsites",""]]});
   if(S.requests.length&&CAN_ADMIN)out.push({id:`req:${S.requests.map(r=>r.id).join(",")}`,sev:"info",title:`${S.requests.length} client${S.requests.length>1?"s are":" is"} waiting for portal access`,body:S.requests.map(r=>r.company||"Client").slice(0,3).join(", "),acts:[["Review","goclients",""]]});
  }
  const rank={critical:0,warn:1,info:2};return out.sort((a,b)=>rank[a.sev]-rank[b.sev])},
 run(force){if(!S.loaded.sites&&ROLE!=="client")return;this.alerts=this.compute();this.checked=new Date();const live=this.live();const n=live.length;
  $$(".bell b").forEach(b=>{b.textContent=n;b.hidden=!n});$$(".bell").forEach(b=>b.classList.toggle("ring",!!n&&b.dataset.act==="agent"));
  if(force){this.scan(()=>this.popup(live,true));return}
  const key=live.map(a=>a.id).join("|");if(live.length&&key!==this.shownKey){this.shownKey=key;this.popup(live)}},
 scan(then){$("#agentPop").innerHTML=`<div class="apop"><div class="scan"><div class="rad"></div>Checking campaigns, bookings and photos…</div></div>`;setTimeout(then,900)},
 popup(list,manual){const box=$("#agentPop");
  if(!list.length){box.innerHTML=`<div class="apop"><div class="ahd"><span class="bot">${ICON.bot}</span><div><b>All clear</b><small>Nothing ends in the next 7 days and every live site has a recent photo.</small></div></div></div>`;setTimeout(()=>{if(box.querySelector(".scan,.alist"))return;box.innerHTML=""},3500);return}
  box.innerHTML=`<div class="apop" role="alertdialog" aria-label="Campaign agent"><div class="ahd"><span class="bot">${ICON.bot}</span><div style="flex:1;min-width:0"><b>Campaign Agent</b><small>${list.length} thing${list.length>1?"s need":" needs"} your attention</small></div><button class="btn sm ghost" data-act="agentclose" aria-label="Close">${ICON.x}</button></div>
   <div class="alist">${list.map(a=>`<div class="al ${a.sev}"><i></i><div><b>${esc(a.title)}</b><small>${esc(a.body)}</small><div class="row" style="gap:6px;margin-top:8px">${(a.acts||[]).map(([l,act,id])=>`<button class="btn sm" data-act="${act}" data-id="${esc(id)}" data-alert="${esc(a.id)}">${l}</button>`).join("")}<button class="btn sm ghost" data-act="agentok" data-alert="${esc(a.id)}">Got it</button></div></div></div>`).join("")}</div>
   <div class="aft"><small>Checked ${this.checked.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} · rechecks every 5 min</small><span class="sp"></span><button class="btn sm" data-act="agentall">Dismiss all</button></div></div>`}
};

/* ============ Client portals ============ */
function buildPortal(cl){
  const camps=S.campaigns.filter(c=>(cl.campaignIds||[]).includes(c.id));const cids=new Set(camps.map(c=>c.id));
  const ids=new Set(camps.flatMap(c=>c.siteIds||[]));
  const inWin=p=>cids.has(p.campaignId)||camps.some(c=>c.startDate&&p.at>=c.startDate&&(!c.endDate||p.at.slice(0,10)<=c.endDate));
  const sites=S.sites.filter(s=>ids.has(s.id)).map(s=>({id:s.id,code:s.code,area:s.area,from:s.from||"",towards:s.towards||"",widthFt:s.widthFt,heightFt:s.heightFt,media:s.media,light:s.light,status:s.status,traffic:s.traffic||"",vehiclesDay:s.vehiclesDay||"",signal:!!s.signal,peak:s.peak||[],audience:s.audience||[],bookedFrom:s.bookedFrom||"",bookedTill:s.bookedTill||"",lat:s.lat||"",lng:s.lng||"",photos:(s.photos||[]).filter(p=>p.asset&&!p.local&&inWin(p)).map(p=>({asset:p.asset,kind:p.kind||"photo",tag:p.tag||"",at:p.at,campaignId:p.campaignId||null}))}));
  return{label:cl.label||"Client",campaigns:camps.map(c=>({id:c.id,name:c.name,client:c.client||"",startDate:c.startDate||"",endDate:c.endDate||"",color:c.color||"#7C3AED",siteIds:(c.siteIds||[]).filter(i=>ids.has(i))})),sites,agency:{traffic:S.settings.traffic||null,theme:S.settings.theme||"adpulse",logo:S.settings.logo||null,agency:S.settings.agency||"",phone:S.settings.phone||"",email:S.settings.email||"",web:S.settings.web||""}};
}
function schedSync(){clearTimeout(schedSync.t);schedSync.t=setTimeout(syncPortals,1500)}
async function syncPortals(){
  if(S.mode!=="live"||!CAN_ADMIN||ROLE!=="team"||!S.loaded.sites||!S.loaded.campaigns||!S.loaded.clients||!S.loaded.portals)return;
  for(const cl of S.clients){if(!cl.id.startsWith("u_"))continue;const snap=buildPortal(cl);const h=String(hashN(JSON.stringify(snap)));if(portals[cl.id]?.hash===h)continue;
    try{await db.doc("portal/"+cl.id).set({...snap,hash:h,syncedAt:new Date().toISOString()})}catch(e){console.warn("portal sync",e)}}
  for(const id of Object.keys(portals))if(!S.clients.some(c=>c.id===id)){try{await db.doc("portal/"+id).delete()}catch(e){}}
}

   `<div class="sec-h"><h2>Client accounts</h2></div>`+(rows?`<div class="grid enter" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${rows}</div>`:`<div class="card">${emptyState("No clients yet","Approve a client's access request, or add a client to preview what they will see.")}</div>`);

function openClient(id,fromReq){

   ${!base&&!req?`<p style="margin:0;color:var(--muted);font-size:13px">A client added here has no login yet; use it to preview their portal. To give a client a real login, share the page with them and approve their request.</p>`:""}

   <div class="row"><span class="sp"></span><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit">${req?"Approve access":"Save client"}</button></div></div></form></div>`);

  $("#clPick").onchange=e=>{e.target.checked?ids.add(e.target.value):ids.delete(e.target.value);$("#clCnt").textContent=ids.size+" selected"};

    try{await put("clients",n);if(req)await db.doc("requests/"+req.id).delete();closeLayer();toast(req?`${n.label} approved. Their dashboard is syncing.`:"Client saved")}catch(err){toast("Couldn't save: "+(err.message||err.code))}};

function vPortal(){
  const D=ROLE==="client"?PORTAL:PREVIEW;
  const banner=ROLE!=="client"?`<div class="pvbar">${ICON.eye}<span>Previewing the dashboard of <b>${esc(D?.label||"")}</b>. This is all they can see.</span><span class="sp"></span><button class="btn sm" data-act="exitpreview">Exit preview</button></div>`:"";
  if(ROLE==="client"&&!PORTAL_READY)return`<div class="skel" style="min-height:220px"></div><div class="kpis" style="margin-top:16px">${'<div class="skel" style="min-height:110px"></div>'.repeat(4)}</div>`;
  if(!D&&ROLE!=="client"){location.hash="clients";return""}
  if(!D)return gate();
  const camps=D.campaigns||[];if(!camps.find(c=>c.id===pCamp))pCamp=(camps.find(c=>c.endDate&&daysTo(c.endDate)>=0)||camps[0])?.id;
  const c=camps.find(x=>x.id===pCamp);
  const head=`<div class="top"><span class="logochip"><img src="${esc(logoSrc())}" alt="${esc(S.settings.agency||"Agency")} logo"></span><h1>${esc(D.label)}<small>${APP_FULL} · your outdoor campaigns with ${esc(D.agency?.agency||S.settings.agency||"us")}</small></h1>${ROLE==="client"&&window.OTS_signOut?`<button class="btn sm" onclick="OTS_signOut()">Sign out</button>`:""}${ROLE==="client"?`<button class="bell" data-act="agent" aria-label="Campaign alerts">${ICON.bell}<b ${Agent.count()?"":"hidden"}>${Agent.count()}</b></button>`:""}</div>`;
  if(!c)return banner+head+`<div class="card">${emptyState("No campaigns yet","Your campaigns will show up here as soon as they are booked.")}</div>`;
  const sites=(c.siteIds||[]).map(id=>D.sites.find(s=>s.id===id)).filter(Boolean);
  const d=c.endDate?daysTo(c.endDate):null,ds=c.startDate?daysTo(c.startDate):null;
  const phase=ds>0?["Starts",ds,ds===1?"day to go":"days to go"]:d<0?["Ended",fmtShort(c.endDate),"campaign complete"]:["Live",d,d===1?"day left":"days left"];
  const photos=sites.flatMap(s=>(s.photos||[]).map(p=>({s,p}))).sort((a,b)=>new Date(b.p.at)-new Date(a.p.at));
  const mon=sites.filter(s=>(s.photos||[]).some(p=>(Date.now()-new Date(p.at))/864e5<=7)).length;
  const areas=new Set(sites.map(s=>s.area)).size;
  const tabs=camps.length>1?`<div class="chips" style="margin-bottom:14px">${camps.map(x=>`<button class="chip ${x.id===c.id?"on":""}" data-act="portalcamp" data-id="${x.id}">${esc(x.name)}</button>`).join("")}</div>`:"";
  const hero=`<div class="phero" style="--pc:${c.color||"#7C3AED"}"><div><div class="sub">${esc(c.client||D.label)} · ${fmtDate(c.startDate)} → ${fmtDate(c.endDate)}</div><h2>${esc(c.name)}</h2>${timeline(c,true)}</div><div class="big"><span>${phase[0]}</span><b>${phase[1]}</b><span>${phase[2]}</span></div></div>`;
  const k=[["Sites",sites.length,"var(--violet)","sites"],["Photographed this week",mon,"var(--ok)","cam"],["Photos & videos",photos.length,"var(--cyan)","img"],...(sites.some(x=>otsOf(x))?[["Est. daily views (OTS)","~"+fmtK(sites.reduce((a,x)=>a+otsOf(x),0)),"var(--pink)","eye",true]]:[["Areas covered",areas,"var(--pink)","pin"]])];
  const kp=`<div class="kpis enter" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:16px">${k.map(([l,n,col,i,raw])=>`<div class="card kpi" style="--c:${col}"><div class="ic" style="background:${col}">${ICON[i]}</div><div class="n" ${raw?"":`data-count="${n}"`}>${raw?n:0}</div><small>${l}</small></div>`).join("")}</div>`;
  const feed=photos.slice(0,6).map(({s,p})=>`<div class="it" data-act="site" data-id="${s.id}" style="cursor:pointer">${mediaTag(p,s)}<div style="min-width:0"><b class="mono" style="color:var(--violet)">${esc(s.code)}</b> · ${esc(s.area)}<br><small>${esc(p.tag||"Photo")} · ${fmtDT(p.at)}</small></div></div>`).join("")||`<p style="color:var(--muted);margin:0">Photos from the field will appear here once your sites are up.</p>`;
  const cards=sites.map(s=>{const lp=lastImg(s),lm=lastPhoto(s);return`<article class="card scard" data-act="site" data-id="${s.id}"><div class="ph"><img src="${esc(lp?photoSrc(lp):placeholder(s))}" alt="" loading="lazy" data-sid="${s.id}" onerror="phFix(this)"><span class="pill ${phase[0]==="Live"?"st-available":phase[0]==="Starts"?"st-maintenance":"st-booked"}">${phase[0]==="Live"?"Live":phase[0]==="Starts"?"Scheduled":"Completed"}</span>${(s.photos||[]).length?`<span class="cnt">${mediaCount(s)}</span>`:""}</div><div class="bd"><span class="code">${esc(s.code)}</span><h3>${esc(s.area)}</h3><div class="dir">${esc(s.from||"—")} ${ICON.arrow} ${esc(s.towards||"—")}</div>${trafficTag(s)?`<div>${trafficTag(s)}</div>`:""}<div class="meta"><span class="tag mono">${sizeOf(s)} ft</span><span class="tag">${esc(s.media)}</span><span class="tag">${esc(s.light)}</span></div><small style="color:var(--muted);font-weight:600">${lm?"Last update "+ago(lm.at):"Photo pending"}</small></div></article>`}).join("");
  return banner+head+tabs+hero+kp+`<div class="pgrid enter"><div class="card pad"><div class="sec-h"><h2>Where your sites are</h2></div>${mapHTML(sites)}</div><div class="card pad"><div class="sec-h"><h2>Latest photos</h2><span class="sp"></span>${downloads?`<button class="btn sm pri" data-act="portalpdf" data-id="${c.id}">${ICON.dl}PDF report</button>`:""}</div><div class="feed">${feed}</div></div></div>
  <div class="sec-h" style="margin-top:22px"><h2>Your sites</h2><span class="eyebrow">${sites.length} sites</span></div><div class="cards enter">${cards}</div>`;
}

/* ============ layer, toast, palette ============ */
function openLayer(h){$("#layer").innerHTML=h;const f=$("#layer input,#layer select,#layer button:not(.ghost)");document.body.style.overflow="hidden"}
function closeLayer(){$("#layer").innerHTML="";document.body.style.overflow=""}
let toastT;function toast(msg,undo){$(".toast")?.remove();clearTimeout(toastT);const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.innerHTML=`<span>${esc(msg)}</span>${undo?"<button>Undo</button>":""}`;if(undo)d.querySelector("button").onclick=()=>{undo();d.remove()};document.body.appendChild(d);toastT=setTimeout(()=>d.remove(),undo?5500:3200)}
function confirmBox(msg,yes,label="Delete"){openLayer(`<div class="scrim" data-act="close"></div><div class="modal" style="width:min(420px,calc(100% - 24px))"><div class="mb"><h2 style="font-size:20px">${esc(msg)}</h2><div class="row"><span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="cfYes">${label}</button></div></div></div>`);$("#cfYes").onclick=()=>{closeLayer();yes()}}
function palette(){openLayer(`<div class="scrim" data-act="close"></div><div class="pal" role="dialog" aria-label="Search"><input id="palIn" placeholder="Search site code, area, road, campaign…" autocomplete="off"><div class="res" id="palRes"></div></div>`);const inp=$("#palIn");inp.focus();let idx=0,items=[];
  const run=()=>{const q=inp.value.toLowerCase();items=[...S.sites.filter(s=>[s.code,s.area,s.from,s.towards,s.brand].join(" ").toLowerCase().includes(q)).slice(0,8).map(s=>({h:`<span class="mono" style="color:var(--violet);font-weight:700">${esc(s.code)}</span><span>${esc(s.area)} · ${sizeOf(s)}</span><span class="sp"></span>${pill(s)}`,go:()=>{closeLayer();openSite(s.id)}})),...S.campaigns.filter(c=>c.name.toLowerCase().includes(q)).slice(0,4).map(c=>({h:`${ICON.camp.replace("<svg",'<svg width="16" height="16"')}<b>${esc(c.name)}</b><span style="color:var(--muted)">campaign</span>`,go:()=>{closeLayer();F.campaign=c.id;location.hash="sites";go("sites")}})),...NAV.filter(n=>n[1].toLowerCase().includes(q)).map(n=>({h:`Go to <b>${n[1]}</b>`,go:()=>{closeLayer();location.hash=n[0]}}))];idx=0;draw()};
  const draw=()=>{$("#palRes").innerHTML=items.map((it,i)=>`<button class="${i===idx?"on":""}" data-i="${i}">${it.h}</button>`).join("")||'<p style="padding:14px 18px;color:var(--muted);margin:0">Nothing found</p>'};
  inp.oninput=run;inp.onkeydown=e=>{if(e.key==="ArrowDown"){idx=Math.min(idx+1,items.length-1);draw();e.preventDefault()}if(e.key==="ArrowUp"){idx=Math.max(idx-1,0);draw();e.preventDefault()}if(e.key==="Enter"&&items[idx])items[idx].go()};
  $("#palRes").onclick=e=>{const b=e.target.closest("[data-i]");if(b)items[+b.dataset.i].go()};run()}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palette()}if(e.key==="Escape")closeLayer()});

 if(["stArea","stSize","stStatus"].includes(t.id)){const k={stArea:"area",stSize:"size",stStatus:"status"}[t.id];Studio.cfg.source[k]=t.value;Studio.cfg.title="";Studio.cfg.slides=[];rebuildStudio()}
 if(t.id==="stGroup"){Studio.cfg.groupBy=t.value;Studio.cfg.slides=[];rebuildStudio()}
 if(t.dataset.fld){Studio.cfg.fields[t.dataset.fld]=t.checked;Studio.renderSlides();Studio.dirty()}
 if(t.id==="stSum"){Studio.cfg.summary=t.checked;Studio.renderSlides()}
 if(t.id==="stIdx"){Studio.cfg.index=t.checked;Studio.renderSlides()}
});
document.addEventListener("input",e=>{if(e.target.id==="fq"){F.q=e.target.value;clearTimeout(window._fq);window._fq=setTimeout(()=>{render(true);const i=$("#fq");i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)}});
document.addEventListener("submit",e=>{if(e.target.id==="trafForm"){e.preventDefault();const t={};for(const k of Object.keys(TDEF))t[k]=+$("#tr-"+k).value||TDEF[k];S.settings.traffic=t;saveSettings().then(()=>{toast("Traffic assumptions saved");render(true)})}
 if(e.target.id==="setForm"){e.preventDefault();Object.assign(S.settings,{agency:$("#sAg").value.trim(),web:$("#sWeb").value.trim(),phone:$("#sPh").value.trim(),email:$("#sEm").value.trim()});saveSettings().then(()=>toast("Details saved"))}});
$("#fileCam").onchange=e=>{addShots([...e.target.files]);e.target.value=""};
$("#fileGal").onchange=e=>{addShots([...e.target.files]);e.target.value=""};
$("#fileLogo").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(f.size>3*1048576){toast("Pick a logo under 3 MB");return}
  try{toast("Uploading logo…");const i=await loadImg(URL.createObjectURL(f));const sc=Math.min(1,600/Math.max(i.naturalWidth,i.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(i.naturalWidth*sc);c.height=Math.round(i.naturalHeight*sc);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
   if(S.mode==="live"&&assets){const blob=await new Promise(r=>c.toBlob(r,"image/png"));const up=await assets.upload(blob,{type:"image/png"});S.settings.logo={asset:up.id}}else S.settings.logo={data:c.toDataURL("image/png")};
   applyTheme();await saveSettings();render(true);toast("Logo updated")}catch(err){toast("Couldn't use that image: "+(err.message||err.code||err))}};
$("#fileVid").onchange=e=>{addShots([...e.target.files]);e.target.value=""};
$("#fileAdd").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const s=JSON.parse(JSON.stringify(S.sites.find(x=>x.id===e.target.dataset.site)));const gps=await exifGPS(f).catch(()=>null);const who=ls.get("sitesnap-name","")||"Office";const vid=f.type.startsWith("video/");if(vid&&f.size>20*1048576){toast("Keep videos under 20 MB (about 30 seconds)");return}toast(vid?"Uploading video…":"Uploading photo…");const ok=await runJob({site:s,campId:"",who,shots:[{id:uid(),file:f,url:URL.createObjectURL(f),kind:vid?"video":"photo",tag:vid?"Video":"Day",gps:vid?null:gps}]});toast(ok?(vid?"Video added":"Photo added"):"Upload failed. Check your connection and try again.");if(ok)openSite(s.id)};

applyTheme();boot();

  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("/sw.js").then(r=>{
      console.log("AdPulse OTS PWA active:",r.scope);
    }).catch(err=>{
      console.warn("PWA ServiceWorker registration failed:",err);
    });
  });
}
