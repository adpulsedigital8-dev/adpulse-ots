      </form>
    </div>`);

  const updateModalStats = (visCount) => {
    const pill = $("#pcmCountPill");
    const tabSelCnt = $("#pcmTabSelCnt");
    if (tabSelCnt) tabSelCnt.textContent = PCF.selected.size;

    const selSites = allPool.filter(s => PCF.selected.has(s.id));
    const selVendors = new Set(selSites.map(s => s.vendor || "AdPulse IMC"));
    const vCount = selVendors.size;
    const vText = vCount > 1 ? ` (${vCount} vendors)` : (vCount === 1 ? ` (1 vendor)` : "");

    if (pill) {
      if (typeof visCount === "number") {
        pill.textContent = `${PCF.selected.size} selected${vText} (${visCount} shown)`;
      } else {
        pill.textContent = `${PCF.selected.size} selected${vText}`;
      }
    }
    const sumEl = $("#pcmStatsSummary");
    if (sumEl && PCF.selected.size > 0) {
      const sqft = selSites.reduce((acc, s) => acc + (s.sqft || 0), 0);
      sumEl.textContent = `· ${sqft.toLocaleString()} Total SQFT · ${vCount} Media Provider${vCount > 1 ? 's' : ''}`;
    } else if (sumEl) {
      sumEl.textContent = "";
    }
  };

  const applyModalFilter = () => {
    const q = ($("#pcmSearch")?.value || "").toLowerCase().trim().replace(/ch[ae]nab/g, "chinab");
    const v = ($("#pcmVendor")?.value || "").trim();
    const a = ($("#pcmArea")?.value || "").toLowerCase().trim();
    const st = ($("#pcmStatus")?.value || "").trim();

    const items = $$("#pcmPickList .camp-site-item");
    let visibleCount = 0;

    // Tokenize search query for multi-keyword matching
    const qTokens = q.split(/\s+/).filter(Boolean);

    items.forEach(l => {
      const sid = l.dataset.sid || "";
      const isSelected = PCF.selected.has(sid);
      const src = l.dataset.source || "";

      // 1. Source / Selected Only tab match
      let srcMatch = true;
      if (activeSource === "selected") {
        srcMatch = isSelected;
      } else if (activeSource !== "all") {
        srcMatch = src === activeSource;
      }
      
      // 2. Vendor / Advertiser dropdown match
      let vMatch = true;
      if (v === "__adpulse__") {
        vMatch = src === "master";
      } else if (v) {
        vMatch = (l.dataset.vendor || "") === v;
      }

      // 3. Area match
      const aMatch = !a || (l.dataset.area || "").toLowerCase() === a;

      // 4. Status match
      const stMatch = !st || (st === "available" ? l.dataset.avail === "1" : l.dataset.avail === "0");
      
      // 5. Search query match (fast match on pre-indexed data-search attribute)
      let qMatch = true;
      if (qTokens.length) {
        const textToSearch = l.dataset.search || (
          (l.dataset.sid || "") + " " +
          (l.dataset.code || "") + " " +
          (l.dataset.vendor || "") + " " +
          (l.dataset.area || "")
        ).toLowerCase();
        const normSearch = textToSearch.replace(/[-\s]/g, "");

        qMatch = qTokens.every(tok => {
          const normTok = tok.replace(/[-\s]/g, "");
          return textToSearch.includes(tok) || (normTok && normSearch.includes(normTok));
        });
      }

      const isVis = Boolean(srcMatch && vMatch && aMatch && stMatch && qMatch);
      l.hidden = !isVis;
      l.classList.toggle("is-hidden", !isVis);
      l.style.setProperty("display", isVis ? "flex" : "none", "important");
      if (isVis) visibleCount++;
    });

    updateModalStats(visibleCount);
  };

  // Wire Source Segment Tabs
  const tabBtns = $$("#pcmSourceTabs button");
  tabBtns.forEach(btn => {
    btn.onclick = () => {
      tabBtns.forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      activeSource = btn.dataset.msrc;
      if (activeSource === "master") {
        if ($("#pcmVendor") && $("#pcmVendor").value !== "__adpulse__") {
          $("#pcmVendor").value = "";
        }
      } else if (activeSource === "vendor") {
        if ($("#pcmVendor") && $("#pcmVendor").value === "__adpulse__") {
          $("#pcmVendor").value = "";
        }
      } else if (activeSource === "selected") {
        if ($("#pcmVendor")) $("#pcmVendor").value = "";
      }
      applyModalFilter();
    };
  });

  // Checkbox toggle handler
  $("#pcmPickList").onchange = e => {
    const ck = e.target;
    if (ck && ck.type === "checkbox") {
      if (ck.checked) PCF.selected.add(ck.value);
      else PCF.selected.delete(ck.value);
      ck.closest("label")?.classList.toggle("selected", ck.checked);
      updateModalStats();
      if (activeSource === "selected" && !ck.checked) {
        const lbl = ck.closest("label");
        if (lbl) {
          lbl.hidden = true;
          lbl.classList.add("is-hidden");
          lbl.style.setProperty("display", "none", "important");
        }
      }
    }
  };

  let _pcmSearchDebounce = null;
  if ($("#pcmSearch")) {
    $("#pcmSearch").oninput = () => {
      clearTimeout(_pcmSearchDebounce);
      _pcmSearchDebounce = setTimeout(applyModalFilter, 70);
    };
  }
  if ($("#pcmVendor")) $("#pcmVendor").onchange = () => {
    const v = $("#pcmVendor").value;
    if (v === "__adpulse__") {
      activeSource = "master";
      tabBtns.forEach(b => b.classList.toggle("on", b.dataset.msrc === "master"));
    } else if (v) {
      if (activeSource === "master" || activeSource === "selected") {
        activeSource = "all";
        tabBtns.forEach(b => b.classList.toggle("on", b.dataset.msrc === "all"));
      }
    }
    applyModalFilter();
  };
  if ($("#pcmArea")) $("#pcmArea").onchange = applyModalFilter;
  if ($("#pcmStatus")) $("#pcmStatus").onchange = applyModalFilter;

  if ($("#pcmResetFilt")) $("#pcmResetFilt").onclick = () => {
    if ($("#pcmSearch")) $("#pcmSearch").value = "";
    if ($("#pcmVendor")) $("#pcmVendor").value = "";
    if ($("#pcmArea")) $("#pcmArea").value = "";
    if ($("#pcmStatus")) $("#pcmStatus").value = "";
    activeSource = "all";
    tabBtns.forEach(b => b.classList.toggle("on", b.dataset.msrc === "all"));
    applyModalFilter();
  };

  // Select all visible / filtered sites
  if ($("#pcmSelAll")) $("#pcmSelAll").onclick = () => {
    $$("#pcmPickList label:not([hidden]):not(.is-hidden) input[type=checkbox]").forEach(ck => {
      ck.checked = true;
      PCF.selected.add(ck.value);
      ck.closest("label")?.classList.add("selected");
    });
    updateModalStats();
    if (activeSource === "selected") applyModalFilter();
  };

  // Deselect only currently visible / filtered sites
  if ($("#pcmClrVisible")) $("#pcmClrVisible").onclick = () => {
    $$("#pcmPickList label:not([hidden]):not(.is-hidden) input[type=checkbox]").forEach(ck => {
      ck.checked = false;
      PCF.selected.delete(ck.value);
      ck.closest("label")?.classList.remove("selected");
    });
    updateModalStats();
    if (activeSource === "selected") applyModalFilter();
  };

  // Deselect all sites across all vendors
  if ($("#pcmClrAll")) $("#pcmClrAll").onclick = () => {
    $$("#pcmPickList label input[type=checkbox]").forEach(ck => {
      ck.checked = false;
      ck.closest("label")?.classList.remove("selected");
    });
    PCF.selected.clear();
    updateModalStats();
    if (activeSource === "selected") applyModalFilter();
  };

  if ($("#pcmGenPptBtn")) $("#pcmGenPptBtn").onclick = async () => {
    const client = ($("#pcmClient")?.value || "").trim() || "Proposed Client";
    const title = ($("#pcmTitle")?.value || "").trim() || (client + " Proposed Campaign 2026");
    PCF.client = client;
    PCF.title = title;
    const selIds = [...PCF.selected];
    if (!selIds.length) {
      toast("⚠️ Please select at least 1 site to generate proposal presentation");
      return;
    }
    closeLayer();
    // Auto-save into Campaigns so it is permanently visible in Campaigns tab!
    await saveAsProposedCampaign(selIds, client, title, true);
    // Also open directly in Studio Presentations tab
    generateProposedPresentation(selIds, client, title);
    toast("🎉 Saved in Campaigns and opened in Presentations!");
  };

  if ($("#pcmSaveCampBtn")) $("#pcmSaveCampBtn").onclick = async () => {
    const client = ($("#pcmClient")?.value || "").trim();
    const title = ($("#pcmTitle")?.value || "").trim();
    PCF.client = client;
    PCF.title = title;
    closeLayer();
    await saveAsProposedCampaign([...PCF.selected], client, title);
  };

  // Full Page Toggle Handler
  let isFull = false;
  const modalWrap = document.querySelector(".pc-expanded-modal");
  const toggleFull = () => {
    isFull = !isFull;
    if (modalWrap) modalWrap.classList.toggle("pc-fullscreen", isFull);
    const icon = $("#pcmExpandIcon");
    const lab = $("#pcmExpandLabel");
    if (icon) icon.textContent = isFull ? "🗗" : "⛶";
    if (lab) lab.textContent = isFull ? "Chota karen" : "Full Page";
  };
  if ($("#pcmToggleExpand")) $("#pcmToggleExpand").onclick = toggleFull;
  const mhEl = document.querySelector(".pc-expanded-modal .mh");
  if (mhEl) mhEl.ondblclick = toggleFull;

  updateModalStats();
}


function vProposeCampaign() {
  const allPool = getAllProposalSitesPool();
  if (!allPool.length) {
    return pgTop("Propose Campaign Sites", "Loading inventory pool…") + `<div class="cards">${'<div class="skel"></div>'.repeat(6)}</div>`;
  }

  const masterSites = allPool.filter(s => s.source === "master");
  const vendorSites = allPool.filter(s => s.source === "vendor");

  // Filter pool
  const q = (PCF.q || "").toLowerCase().trim().replace(/ch[ae]nab/g, "chinab");
  const filtered = allPool.filter(s => {
    if (PCF.source === "master" && s.source !== "master") return false;
    if (PCF.source === "vendor" && s.source !== "vendor") return false;
    if (PCF.vendor && s.vendor !== PCF.vendor) return false;
    if (PCF.area && s.area.toLowerCase() !== PCF.area.toLowerCase()) return false;
    if (PCF.media && s.media !== PCF.media) return false;
    if (PCF.status && s.status !== PCF.status) return false;
    if (!q) return true;
    const haystack = [s.code, s.vendor, s.name, s.location, s.area, s.media, s.rate, s.from, s.towards, s.availability].join(" ").toLowerCase();
    return haystack.includes(q);

/* ============ Vendors Sites Preview (52 Vendor PPT & PDF Presentations) ============ */
const VPF = { vendor: "", q: "", media: "", status: "", view: "cards", groupsShown: 8 };

let _vpFetching = false;
let _cachedVendorSites = null;
function invalidateVendorPreviewCache() {
  _cachedVendorSites = null;
  window._cachedProposalPool = null;
}

function getVendorPreviewSites() {
  if (_cachedVendorSites && _cachedVendorSites.length) return _cachedVendorSites;
  const raw = window.VENDOR_PREVIEW_SITES_2026 || [];
  if (!raw.length && !_vpFetching) {
    _vpFetching = true;
    fetch("/vendor_preview_2026.json?v=50.9").then(r => r.json()).then(data => {
      if (Array.isArray(data) && data.length) {
        window.VENDOR_PREVIEW_SITES_2026 = data;
        invalidateVendorPreviewCache();
        render(true);
      }
    }).catch(() => {}).finally(() => { _vpFetching = false; });
  }
  const savedEdits = ls.get("sitesnap-vp-edits", {});
  const customAdded = ls.get("sitesnap-vp-added", []);
  const deletedMap = ls.get("sitesnap-vp-deleted", {});
  const combined = [...raw, ...(Array.isArray(customAdded) ? customAdded : [])].filter(s => s && !deletedMap[s.id]);
  _cachedVendorSites = combined.map(s => {
    const ed = savedEdits[s.id];
    const merged = ed ? { ...s, ...ed } : s;
    const pUrl = merged.photo ? (merged.photo.startsWith("data:") || merged.photo.includes("?") ? merged.photo : merged.photo + "?v=50.9") : "";
    const w = +(merged.widthFt || 60);
    const h = +(merged.heightFt || 20);
    const sq = merged.sqft || (w * h);
    const obj = {
      ...merged,
      widthFt: w,
      heightFt: h,
      sqft: sq,
      photo: pUrl,
      photos: merged.photos && merged.photos.length ? merged.photos : (pUrl ? [{ id: merged.id + "-p1", src: pUrl, url: pUrl, at: "2026-11-23", caption: merged.name }] : []),
      client: merged.vendor,
      brand: merged.vendor,
      excelMedium: (merged.media || "BILLBOARD").toUpperCase(),
      excelSqft: String(sq),
      excelAvailability: merged.availability || "Available",
      excelStatus: merged.rate || "Rate on Request",
      statusLabel: merged.rate || "Rate on Request",
      startDate: "20-Nov-26",
      endDate: merged.availability && !/available|immediate/i.test(merged.availability) ? merged.availability : "20-Dec-26",
      day: "30",
      vendorEndDate: merged.availability || "Available",
      price: merged.rate || "Rate on Request",
      rates: merged.rate || "Rate on Request",
      area: merged.area || "Karachi"
    };
    obj._searchStr = [obj.code, obj.vendor, obj.name, obj.location, obj.direction, obj.from, obj.towards, obj.size, obj.availability, obj.rate, obj.media, obj.rawText].filter(Boolean).join(" ").toLowerCase();
    return obj;
  });
  return _cachedVendorSites;
}

function saveVendorPreviewEdit(id, updates) {
  invalidateVendorPreviewCache();
  const savedEdits = ls.get("sitesnap-vp-edits", {});
  savedEdits[id] = { ...(savedEdits[id] || {}), ...updates };
  ls.set("sitesnap-vp-edits", savedEdits);
  const raw = window.VENDOR_PREVIEW_SITES_2026 || [];
  const item = raw.find(x => x.id === id);
  if (item) Object.assign(item, updates);
  const customAdded = ls.get("sitesnap-vp-added", []);
  const cItem = Array.isArray(customAdded) ? customAdded.find(x => x.id === id) : null;
  if (cItem) {
    Object.assign(cItem, updates);
    ls.set("sitesnap-vp-added", customAdded);
  }
}

function applyVpInlineTableEdit(siteId, field, rawVal) {
  const all = getVendorPreviewSites();
  const s = all.find(x => x && x.id === siteId);
  if (!s) return null;
  const val = String(rawVal ?? "").trim();
  const updates = {};
  if (field === "sNo") updates.sNo = parseInt(val, 10) || s.sNo;
  else if (field === "code") updates.code = val || s.code;
  else if (field === "vendor") updates.vendor = val || s.vendor;
  else if (field === "media") updates.media = val || s.media;
  else if (field === "location") { updates.location = val || s.location; updates.name = val || s.name; }
  else if (field === "direction") {
    const parts = val.split(/→|->/);
    if (parts.length >= 2) {
      updates.from = parts[0].replace(/^From\s+/i, "").trim();
      updates.towards = parts.slice(1).join(" ").replace(/^Towards\s+/i, "").trim();
    } else {
      updates.from = val;
    }
    updates.direction = `From ${updates.from || s.from} → Towards ${updates.towards || s.towards}`;
  }
  else if (field === "w") {
    const w = parseFloat(val) || s.widthFt || 60;
    const h = +s.heightFt || 20;
    updates.widthFt = w;
    updates.sqft = Math.round(w * h);
    updates.size = `${w}x${h} ft`;
  }
  else if (field === "h") {
    const w = +s.widthFt || 60;
    const h = parseFloat(val) || s.heightFt || 20;
    updates.heightFt = h;
    updates.sqft = Math.round(w * h);
    updates.size = `${w}x${h} ft`;
  }
  else if (field === "sqft") {
    updates.sqft = parseInt(val, 10) || s.sqft;
  }
  else if (field === "availability") {
    updates.availability = val || "Available";
    updates.status = /available|immediate|current|avl|new arrival/i.test(updates.availability) && !/not\s*available|booked/i.test(updates.availability) ? "available" : "booked";
  }
  else if (field === "rate") {
    updates.rate = val || "Rate on Request";
  }
  saveVendorPreviewEdit(siteId, updates);
  toast("✅ Site updated");
  return { ...s, ...updates };
}

      const w = parseFloat(wInp.value) || 0, h = parseFloat(hInp.value) || 0;
      if (w > 0 && h > 0) sqInp.value = String(Math.round(w * h));
    };
    wInp.oninput = syncSq;
    hInp.oninput = syncSq;
  }
  const photoInp = $("#vpPhotoInput");
  if (photoInp) {
    photoInp.onchange = e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        pendingPhotoDataUrl = ev.target.result;
        const imgEl = $("#vpModalImg");

        toast("📷 New photo selected — click Save Site Changes to apply!");

      reader.readAsDataURL(file);

      const newSite = {
        id: "site-vp-" + Date.now(),
        sNo: S.sites.length + 1,
        code: s.code || `VP-${S.sites.length + 1}`,
        client: s.vendor,
        brand: s.vendor,
        medium: (s.media || "HOARDING").toUpperCase(),
        excelMedium: (s.media || "HOARDING").toUpperCase(),
        media: s.media || "Hoarding",
        name: s.location || s.name,
        title: s.location || s.name,
        location: s.location || s.name,
        area: "Karachi",
        from: s.from || "",
        towards: s.towards || "",
        widthFt: +s.widthFt || 60,
        heightFt: +s.heightFt || 20,
        width: +s.widthFt || 60,
        height: +s.heightFt || 20,
        sqft: s.sqft || 1200,
        excelSqft: String(s.sqft || 1200),
        startDate: today(),
        endDate: s.availability || "",
        availability: s.availability || "Available",
        excelAvailability: s.availability || "Available",
        statusLabel: s.rate || "EXTENDABLE",
        excelStatus: s.rate || "EXTENDABLE",
        status: s.status || "available",
        day: "30",
        vendor: s.vendor,
        vendorEndDate: s.availability || "Available",
        rates: s.rate || "Rate on Request",
        price: s.rate || "Rate on Request",
        photos: s.photo ? [{ id: "p-" + Date.now(), src: s.photo, url: s.photo, tag: "Day", at: new Date().toISOString() }] : []
      };
      await put("sites", newSite);
      S.sites.push(newSite);
      persistLocal();
      toast(`✅ Added "${newSite.name}" to Master Sites & Vendor Booked Site!`);
    };
  }
  const delBtn = $("#vpDeleteSiteBtn");
  if (delBtn) {
    delBtn.onclick = () => {
      confirmBox(`Delete "${s.location || s.name}" from ${s.vendor}?`, () => {
        const deletedMap = ls.get("sitesnap-vp-deleted", {});
        deletedMap[s.id] = true;
        ls.set("sitesnap-vp-deleted", deletedMap);
        invalidateVendorPreviewCache();
        closeLayer();
        render(true);
        toast("🗑️ Vendor site deleted");
      });
    };
  }
  const form = $("#vpEditForm");
  if (form) {
    form.onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(form);
      const w = parseFloat(fd.get("widthFt")) || s.widthFt || 60;
      const h = parseFloat(fd.get("heightFt")) || s.heightFt || 20;
      const updates = {
        sNo: parseInt(fd.get("sNo"), 10) || s.sNo || 1,
        code: fd.get("code").trim() || s.code,
        vendor: fd.get("vendor").trim() || s.vendor,
        location: fd.get("location").trim() || s.location,
        name: fd.get("location").trim() || s.name,
        from: fd.get("from").trim(),
        towards: fd.get("towards").trim(),
        direction: `From ${fd.get("from").trim()} → Towards ${fd.get("towards").trim()}`,
        widthFt: w,
        heightFt: h,
        size: `${w}x${h} ft`,
        sqft: parseInt(fd.get("sqft"), 10) || Math.round(w * h),
        media: fd.get("media").trim(),
        availability: fd.get("availability").trim(),
        status: /available|immediate|current|avl|new arrival/i.test(fd.get("availability")) && !/not\s*available|booked/i.test(fd.get("availability")) ? "available" : "booked",
        rate: fd.get("rate").trim(),
        rawText: fd.get("rawText").trim()
      };
      if (pendingPhotoDataUrl) {
        updates.photo = pendingPhotoDataUrl;
        updates.photos = [{ id: s.id + "-p1", src: pendingPhotoDataUrl, url: pendingPhotoDataUrl, at: new Date().toISOString(), caption: updates.name }];
      }
      if (isNew) {
        const customAdded = ls.get("sitesnap-vp-added", []);
        customAdded.push({ ...s, ...updates });
        ls.set("sitesnap-vp-added", customAdded);
        invalidateVendorPreviewCache();
      } else {
        saveVendorPreviewEdit(s.id, updates);
      }
      closeLayer();
      render(true);
      toast(isNew ? "✅ New vendor site added!" : "✅ Vendor site changes saved!");
    };
  }
}

function openMasterDeck(filterType = "all") {
  let title = "Master File - All 84 Karachi Sites (2026)";
  let subtitle = "Master Presentation · Complete portfolio overview & booking schedule";
  let src = { type: "all" };

  if (filterType === "available") {
    title = "Available & Upcoming Sites - Karachi";
    subtitle = "Sites ready for immediate booking or upcoming free schedule";
    src = { type: "filter", status: "available", area: "", size: "", vendor: "" };
  } else if (filterType === "booked") {
    title = "Currently Booked Sites Portfolio";
    subtitle = "Active billboard deployments & campaign bookings with duration";
    src = { type: "filter", status: "booked", area: "", size: "", vendor: "" };
  }

  Studio.cfg = Studio.fresh(src);
  Studio.cfg.title = title;
  Studio.cfg.subtitle = subtitle;
  Studio.cfg.summary = true;
  Studio.cfg.fields.vendor = true;
  Studio.build();
  Studio.active = true;
  location.hash = "studio";
  go("studio", true);
  toast(`Opening ${title}…`);
}

async function sync2026MasterData(notify = true) {
  try {
    if (notify) toast("Updating to 2026 Master Data (84 Sites & 8 client campaigns)…");
    let sites = window.MASTER_SITES_2026;
    let campaigns = window.MASTER_CAMPAIGNS_2026;
    if (!sites || !sites.length) {
      const res = await fetch("/master_sites_2026.json");
      sites = await res.json();
    }
    if (!campaigns || !campaigns.length) {
      const res2 = await fetch("/master_campaigns_2026.json");
      campaigns = await res2.json();
    }
    if (!sites || !sites.length) throw new Error("Could not load 2026 dataset");

    S.sites = sites;
    S.campaigns = campaigns || [];
    persistLocal();
    if (S.mode === "live" && db) {
      for (const s of sites) await put("sites", s);
      for (const oldC of S.campaigns) { if (!(campaigns || []).some(nc => nc.id === oldC.id)) await del("campaigns", oldC.id).catch(() => {}); }
      for (const c of (campaigns || [])) await put("campaigns", c);
    }
    render(true);
    if (notify) toast(`✅ Successfully loaded ${sites.length} Master Sites & ${campaigns.length} Campaigns (2026)!`);
  } catch(e) {
    console.error("2026 master data sync error:", e);
    if (notify) toast("Note on master data sync: " + (e.message || e));
  }
}

      pText.textContent = `✅ Extracted ${parsedSites.length} sites successfully!`;
      pBar.style.width = "100%";
      pPct.textContent = "100%";

      // Calculate dates
      const dates = parsedSites.map(s => s.date).filter(Boolean).sort();
      if (dates.length) {
        if (!sDateInput.value) sDateInput.value = dates[0];
        eDateInput.value = dates[dates.length - 1];
      } else {
        const nextMo = new Date();
        nextMo.setMonth(nextMo.getMonth() + 1);
        eDateInput.value = nextMo.toISOString().slice(0, 10);
      }

      // Populate preview
      prevCount.textContent = `${parsedSites.length} Sites Ready to Import`;
      prevList.innerHTML = parsedSites.map((s, idx) => `
        <div class="row" style="background:var(--surface);padding:8px 12px;border-radius:8px;border:1px solid var(--border);gap:10px;align-items:center">
          <div style="width:48px;height:48px;border-radius:6px;overflow:hidden;background:var(--surface2);flex:none;display:grid;place-items:center">
            ${s.previewUrl ? `<img src="${s.previewUrl}" style="width:100%;height:100%;object-fit:cover" alt="">` : `<span style="font-size:20px">📍</span>`}
          </div>
          <div style="flex:1;min-width:180px">
            <div style="font-weight:700;font-size:14px;color:var(--ink)">${esc(s.name || s.title)}</div>
            <div style="font-size:12px;color:var(--muted)">
              <b style="color:var(--violet)">${esc(s.area)}</b> · ${s.widthFt}×${s.heightFt} ft · ${esc(s.media)}
              ${(s.from || s.towards) ? ` · ${esc(s.from || "—")} → ${esc(s.towards || "—")}` : ""}
            </div>
          </div>
          <div style="flex:none;text-align:right">
            ${s.availability ? `<span class="pill ${/subject to avail|available/i.test(s.availability) ? 'st-available' : 'st-booked'}" style="font-size:11px;font-weight:700">${/subject to avail|available/i.test(s.availability) ? '' : '📅 '}${esc(s.availability)}</span>` : `<span class="pill st-available" style="font-size:11px">Available</span>`}
          </div>
        </div>
      `).join("");

      prevContainer.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = `🚀 Create Campaign (${parsedSites.length} Sites)`;
    } catch(err) {
      console.error("Deck parse error:", err);
      pText.textContent = `❌ Error: ${err.message || err}`;
      toast("Error parsing file: " + (err.message || err));
    }
  }

  submitBtn.onclick = async () => {
    if (!parsedSites.length) return;
    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ Creating Campaign & Sites…";

    try {
      // 1. Wipe previous data if checked
      if ($("#deckClearPrev").checked) {
        await clearAllData(true);
      }

      const campName = campNameInput.value.trim() || "OOH Media Campaign";
      const clientName = $("#deckClientName").value.trim() || "AdPulse IMC";
      const campStart = sDateInput.value || today();
      const campEnd = eDateInput.value || "";
      const bookSites = $("#deckBookSites").checked;

      const createdSiteIds = [];
      const areaSeq = {};

      for (let i = 0; i < parsedSites.length; i++) {
        const p = parsedSites[i];
        areaSeq[p.area] = (areaSeq[p.area] || 0) + 1;
        const ab = (AREAS[p.area] || [0, 0, p.area.replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "OTH"])[2];
        const siteNum = String(areaSeq[p.area]).padStart(4, "0");
        const code = `KHI-${ab}-${siteNum}`;

        const coords = AREAS[p.area] || [24.8138, 67.0300];
        const lat = +(coords[0] + (Math.random() - 0.5) * 0.005).toFixed(6);
        const lng = +(coords[1] + (Math.random() - 0.5) * 0.005).toFixed(6);

        let photoObj = null;
        if (p.photoBlob) {
          try {
            const upBlob = await autoUpscaleImage(p.photoBlob, { targetEdge: 2200, quality: 0.92 });
            const upl = await uploadBlob(upBlob, "image/jpeg");
            photoObj = {
              asset: upl.asset,
              src: upl.local ? memBlobs[upl.asset] : undefined,
              tag: "Day",
              at: new Date().toISOString(),
              by: "Deck Import"
            };
          } catch(e) {
            console.warn("Upload site photo note:", e);
          }
        }

        const isBooked = bookSites && (!!p.date || !/subject to avail|available/i.test(p.availability));
        const siteId = uid();
        const siteObj = {
          id: siteId,
          code: code,
          name: p.title || p.name || code,
          title: p.title || p.name || code,
          area: p.area,
          availability: p.availability || (isBooked ? (p.date || "Not available") : "Available"),
          rates: p.rates || "PKR",
          media: p.media || "Billboard",
          light: p.light || "Lit",
          widthFt: p.widthFt || 20,
          heightFt: p.heightFt || 40,
          from: p.from || "",
          towards: p.towards || "",
          status: isBooked ? "booked" : "available",
          brand: isBooked ? clientName : "",
          bookedFrom: isBooked ? campStart : "",
          bookedTill: isBooked ? (p.date || campEnd) : "",
          lat: lat,
          lng: lng,
          approx: true,
          notes: `Imported from ${fileInput.files[0]?.name || "presentation deck"}: ${p.title} (${p.availability || ""})`,
          photos: photoObj ? [photoObj] : [],
          traffic: "high",
          vehiclesDay: "",
          signal: false,
          peak: ["Morning 8–11", "Evening 5–9"],
          audience: ["Office commuters", "Families & shoppers"],
          createdAt: new Date().toISOString()
        };

        await put("sites", siteObj);
        createdSiteIds.push(siteId);
      }

      // 2. Create the Campaign
      const campId = uid();
      const newCamp = {
        id: campId,
        name: campName,
        client: clientName,
        startDate: campStart,
        endDate: campEnd,
        color: CCOLORS[S.campaigns.length % CCOLORS.length],
        siteIds: createdSiteIds,
        createdAt: new Date().toISOString()
      };
      await put("campaigns", newCamp);

      // Reset and set filter automatically to newly created campaign
      F.campaign = campId;
      F.area = "";
      F.q = "";
      F.status = "";
      F.size = "";
      F.media = "";
      F.lit = "";
      F.traffic = "";

      closeLayer();
      toast(`🎉 Campaign "${campName}" created with ${createdSiteIds.length} sites! Filter auto-set to this campaign.`);
      location.hash = "sites";
      render(true);
    } catch(err) {
      console.error("Submit campaign error:", err);
      submitBtn.disabled = false;
      submitBtn.textContent = "🚀 Create Campaign & Sites";
      toast("Error creating campaign: " + (err.message || err));
    }
  };
}

async function imgData(src,w,h){
  const img=await new Promise((r,j)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>r(i);i.onerror=j;i.src=src});
  const c=document.createElement("canvas");
  const dpi=240;
  const W=Math.round(w*dpi),H=Math.round(h*dpi);
  c.width=W;c.height=H;
  const x=c.getContext("2d");
  x.imageSmoothingEnabled=true;
  x.imageSmoothingQuality="high";
  x.fillStyle="#0a0814";
  x.fillRect(0,0,W,H);

  let srcW = img.naturalWidth || img.width || 1200;
  let srcH = img.naturalHeight || img.height || 900;

  // Auto-crop old bottom watermark bar if present on older uploaded images
  if (srcH > 300 && srcW > 300) {
    try {
      const tc = document.createElement("canvas");
      tc.width = 40; tc.height = 40;
      const tctx = tc.getContext("2d");
      const checkH = Math.round(srcH * 0.12);
      tctx.drawImage(img, 0, srcH - checkH, srcW, checkH, 0, 0, 40, 40);
      const pix = tctx.getImageData(0, 0, 40, 40).data;
      let lum = 0;
      for (let i = 0; i < pix.length; i += 4) lum += (pix[i] + pix[i+1] + pix[i+2]) / 3;
      lum /= (40 * 40);
      let hasRedStripe = false;
      for (let i = 36 * 40 * 4; i < 40 * 40 * 4; i += 4) {
        if (pix[i] > 170 && pix[i+1] < 130 && pix[i+2] < 130) { hasRedStripe = true; break; }
      }
      if (lum < 55 && hasRedStripe) {
        srcH = Math.round(srcH * 0.86);
      }
    } catch(e) {}
  }

  const s=Math.min(W/srcW,H/srcH);
  const dw=Math.round(srcW*s),dh=Math.round(srcH*s);
  x.drawImage(img,0,0,srcW,srcH,Math.round((W-dw)/2),Math.round((H-dh)/2),dw,dh);
  return c.toDataURL("image/jpeg",.92);
}

async function deleteSites(ids){
  const sites=ids.map(id=>S.sites.find(x=>x.id===id)).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));
  if(!sites.length)return;
  const camps=S.campaigns.filter(c=>(c.siteIds||[]).some(i=>ids.includes(i))).map(c=>JSON.parse(JSON.stringify(c)));
  for(const c of camps)await put("campaigns",{...c,siteIds:c.siteIds.filter(i=>!ids.includes(i))});
  
  if(!S.archivedSites) S.archivedSites = [];
  sites.forEach(s => {
    s.deletedAt = new Date().toISOString();
    s.archived = true;
    const existingIdx = S.archivedSites.findIndex(x => x.id === s.id);
    if(existingIdx >= 0) S.archivedSites[existingIdx] = s;
    else S.archivedSites.unshift(s);
  });
  saveArchivedSites();

  S.sites=S.sites.filter(x=>!ids.includes(x.id));
  for(const x of sites)await del("sites",x.id);
  ids.forEach(i=>sel.delete(i));
  closeLayer();
  render();
  
  toast(sites.length===1 ? `Moved ${sites[0].code||sites[0].location} to Recycle Bin` : `Moved ${sites.length} sites to Recycle Bin`, async()=>{
    for(const x of sites){
      await restoreSite(x.id);
    }
    for(const c of camps)await put("campaigns",c);
    render();
  });
}

function calcBearing(lat1, lon1, lat2, lon2) {
  const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
            Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
  const b = Math.atan2(y, x) * 180 / Math.PI;
  return (b + 360) % 360;
}

function calcDistMeters(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function headingToDirection(h) {
  if (h == null || isNaN(h)) return "Stationary";
  const dirs = ["North ↑", "North-East ↗", "East →", "South-East ↘", "South ↓", "South-West ↙", "West ←", "North-West ↖"];
  return dirs[Math.round(((h % 360) / 45)) % 8];
}

function findNearestSite(lat, lng) {
  if (!S.sites || !S.sites.length) return null;
  let best = null, minDist = Infinity;
  for (const s of S.sites) {
    if (!s.lat || !s.lng) continue;
    const d = calcDistMeters(lat, lng, +s.lat, +s.lng);
    if (d < minDist) {
      minDist = d;
      best = { site: s, distMeters: Math.round(d) };
    }
  }
  return best;
}

      _leafletMap.panTo([lat, lng]);
    }
  });

  updateRiderUiBadges();
}

function focusRiderOnMap(riderId) {
  let r = (S.riders || []).find(x => x.id === riderId);
  if (!r && SAMPLE_KARACHI_RIDER && SAMPLE_KARACHI_RIDER.id === riderId) r = SAMPLE_KARACHI_RIDER;
  if (!r || !_leafletMap) return;

  _followedRiderId = r.id;
  _leafletMap.setView([+r.lat, +r.lng], 17, { animate: true });
  closeLayer();
  toast(`Following ${r.name} live on map`);
}

const RiderTracker = {
  isBroadcasting: false,
  watchId: null,
  wakeLock: null,
  lastCoord: null,
  trail: [],
  riderId: localStorage.getItem("adpulse_rider_id") || ("r_" + Math.random().toString(36).slice(2, 9)),
  riderName: localStorage.getItem("adpulse_rider_name") || "Field Staff (Rider)",
  vehicle: localStorage.getItem("adpulse_rider_vehicle") || "bike",

  async startBroadcast(customName, customVehicle) {
    if (customName) {
      this.riderName = customName;
      localStorage.setItem("adpulse_rider_name", customName);
    }
    if (customVehicle) {
      this.vehicle = customVehicle;
      localStorage.setItem("adpulse_rider_vehicle", customVehicle);
    }
    localStorage.setItem("adpulse_rider_id", this.riderId);

    if (!navigator.geolocation) {
      toast("GPS Geolocation is not supported by your browser");
      return;
    }

    try {
      if ('wakeLock' in navigator) {
        this.wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(e){}

    this.isBroadcasting = true;
    toast("🟢 Starting Live GPS Broadcast…");
    this.showHudBanner();

    this.watchId = navigator.geolocation.watchPosition(
      pos => this.onPositionUpdate(pos),
      err => {
        console.warn("GPS watchPosition error:", err);
        toast("GPS Signal Weak: " + err.message);
      },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 12000 }
    );

    closeLayer();
  },

  async onPositionUpdate(pos) {
    if (!this.isBroadcasting) return;
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const accuracy = Math.round(pos.coords.accuracy || 5);
    let speed = pos.coords.speed != null ? Math.round(pos.coords.speed * 3.6) : 0;
    let heading = pos.coords.heading;

    if (this.lastCoord) {
      if (heading == null || isNaN(heading)) {
        heading = Math.round(calcBearing(this.lastCoord.lat, this.lastCoord.lng, lat, lng));
      }
      if (!speed) {
        const dist = calcDistMeters(this.lastCoord.lat, this.lastCoord.lng, lat, lng);
        const dt = (Date.now() - this.lastCoord.time) / 1000;
        if (dt > 1 && dist > 1) {
          speed = Math.round((dist / dt) * 3.6);
        }
      }
    }

    this.lastCoord = { lat, lng, time: Date.now() };

    this.trail.push([lat, lng]);
    if (this.trail.length > 25) this.trail.shift();

    const payload = {
      id: this.riderId,
      name: this.riderName,
      vehicle: this.vehicle,
      lat,
      lng,
      heading: heading || 0,
      speed,
      accuracy,
      status: speed > 3 ? "moving" : "stopped",
      updatedAt: new Date().toISOString(),
      isLive: true,
      trail: this.trail
    };

    const idx = (S.riders || []).findIndex(r => r.id === this.riderId);
    if (idx >= 0) S.riders[idx] = payload;
    else (S.riders = S.riders || []).push(payload);

    renderRidersOnMap();
    this.updateHud(speed, heading);

    if (typeof put === "function") {
      try {
        await put("riders", payload);
      } catch(e) {
        try { if(db) await db.doc("riders/" + this.riderId).set(payload); } catch(err){}
      }
    }

    if (window.OTS_SB) {
      try {
        const ch = window.OTS_SB.channel('rider-live-tracking');
        ch.send({ type: 'broadcast', event: 'loc', payload });
      } catch(e){}
    }
  },

  stopBroadcast() {
    this.isBroadcasting = false;
    if (this.watchId != null) {
      navigator.geolocation.clearWatch(this.watchId);
      this.watchId = null;
    }
    if (this.wakeLock) {
      try { this.wakeLock.release(); } catch(e){}
      this.wakeLock = null;
    }
    this.hideHudBanner();

    if (typeof put === "function") {
      put("riders", { id: this.riderId, name: this.riderName, isLive: false, status: "offline", updatedAt: new Date().toISOString() });
    }

    toast("🔴 Live GPS Broadcast Stopped");
    closeLayer();
  },

  showHudBanner() {
    let b = document.getElementById("riderHudBanner");
    if (!b) {
      b = document.createElement("div");
      b.id = "riderHudBanner";
      b.className = "rider-hud-banner";
      b.onclick = () => openRiderTrackingModal();
      document.body.appendChild(b);
    }
    b.innerHTML = `<span class="rider-live-dot"></span><span>🛵 Live Tracking Active: <b id="hudSpeedVal">0 km/h</b> (<b id="hudDirVal">North</b>)</span><span style="font-size:11px;background:rgba(255,255,255,0.2);padding:2px 6px;border-radius:6px">Manage ⚙️</span>`;
  },

  updateHud(speed, heading) {
    const sEl = document.getElementById("hudSpeedVal");
    if (sEl) sEl.textContent = speed + " km/h";
    const dEl = document.getElementById("hudDirVal");
    if (dEl) dEl.textContent = headingToDirection(heading);
  },

  hideHudBanner() {
    const b = document.getElementById("riderHudBanner");
    if (b) b.remove();
  }
};

  const vpCell=e.target.closest&&e.target.closest("[data-vptbledit]");
  if(vpCell){
    const [vpid,vpfld]=vpCell.dataset.vptbledit.split(":");
    const vpUp=applyVpInlineTableEdit(vpid,vpfld,vpCell.innerText);
    if(vpUp&&(vpfld==="w"||vpfld==="h")){

    }
    return;
  }
  const cell=e.target.closest&&e.target.closest("[data-tbledit]");
  if(!cell)return;
  const [sid,fld]=cell.dataset.tbledit.split(":");
  const updated=applyInlineTableEdit(sid,fld,cell.innerText);

document.addEventListener("input", e => {
  const t = e.target;
  if (!t) return;
  if (t.id === "pcClientInp") { PCF.client = t.value; }
  if (t.id === "pcTitleInp") { PCF.title = t.value; }

  if (t.id === "pcSearchInp") {
    PCF.q = t.value;
    clearTimeout(_pcSearchDebounce);
    _pcSearchDebounce = setTimeout(() => {
      render();
      const el = $("#pcSearchInp");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 150);
  }

  if (t.id === "vpSearch") {
    VPF.q = t.value;
    clearTimeout(_vpSearchDebounce);
    _vpSearchDebounce = setTimeout(() => {
      render();
      const el = $("#vpSearch");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 150);
  }

  if (t.id === "befSearch") {
    BEF.q = t.value;
    clearTimeout(_befSearchDebounce);
    _befSearchDebounce = setTimeout(() => {
      render();
      const el = $("#befSearch");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 130);
  }

  if (t.id === "fq") {
    F.q = t.value;
    clearTimeout(_fqDebounce);
    _fqDebounce = setTimeout(() => {
      render(true);
      const i = $("#fq");
      if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    }, 120);

});
