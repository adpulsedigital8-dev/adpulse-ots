function resetMapZoom(){
  const banner = document.getElementById("mapInspectBar");
  if(banner) banner.style.display = "none";
  if(!_leafletMap || !_mapMarkerList.length) return;
  const group = L.featureGroup(_mapMarkerList.map(item => item.marker));
  _leafletMap.flyToBounds(group.getBounds().pad(0.15), { duration: 0.8 });
}


function toggleFullPageMap(btn) {
  const wrap = document.querySelector(".mapwrap");
  if (!wrap) return;
  const isFull = wrap.classList.toggle("map-fullscreen-active");
  document.body.style.overflow = isFull ? "hidden" : "";
  const allBtns = document.querySelectorAll("[data-mapfs-btn]");
  allBtns.forEach(b => {
    b.innerHTML = isFull ? "✕ Exit Full Page Map" : "⛶ Full Page Map";
  });
  setTimeout(() => {
    if (_leafletMap) _leafletMap.invalidateSize();
  }, 150);
  setTimeout(() => {
    if (_leafletMap) _leafletMap.invalidateSize();
  }, 400);
}

function mountLeafletMap(list){
  const el = document.getElementById("leafletMap");
  if(!el || typeof L === "undefined") return;
  if(_leafletMap){
    try{ _leafletMap.remove(); }catch(e){}
    _leafletMap = null;
  }
  _mapMarkerList = [];

  const map = L.map(el, { maxZoom: 22, scrollWheelZoom: true, attributionControl: false });
  _leafletMap = map;

  const googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
    maxZoom: 22,
    maxNativeZoom: 20,
    subdomains: ['0','1','2','3'],
    attribution: 'Imagery &copy; Google Earth'
  });
  _googleHybridLayer = googleHybrid;

  const googleSat = L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    maxZoom: 22,
    maxNativeZoom: 20,
    subdomains: ['0','1','2','3'],
    attribution: 'Imagery &copy; Google Satellite'
  });
  _googleSatLayer = googleSat;

  const streetLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 22,
    maxNativeZoom: 19,
    attribution: '&copy; OpenStreetMap'
  });
  _streetLayer = streetLayer;

  const googleStreet = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 22,
    maxNativeZoom: 20,
    subdomains: ['0','1','2','3'],
    attribution: 'Map &copy; Google'
  });

  const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 22,
    maxNativeZoom: 19,
    attribution: 'Tiles &copy; Esri'
  });

  // Default to Google Earth Hybrid for photorealistic 3D satellite view
  googleHybrid.addTo(map);

  const baseMaps = {
    "🌍 Google Earth Hybrid": googleHybrid,
    "🗺️ Street Map (OSM)": streetLayer,
    "📍 Google Streets": googleStreet,
    "🛰️ Esri Satellite": satLayer
  };

  L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

  const col = { available: "#0E9F76", booked: "#E03656", expiring: "#EE7422", maintenance: "#DB8F06" };
  const valid = (list || []).filter(s => s && s.lat && s.lng && isFinite(+s.lat) && isFinite(+s.lng));
  const markers = [];

  const adpulseMark = markSrc();
  valid.forEach(s => {
    const st = effStatus(s);
    const c = col[st] || "#D9161D";
    const sLabel = s.sNo ? `S#${s.sNo}` : (s.code || "");
    const icon = L.divIcon({
      className: "custom-map-pin",
      html: `<div class="adpulse-pin-wrap" title="AdPulse · ${esc(sLabel)} · ${esc(s.name || s.location || s.area)}">
        <div class="adpulse-pin-tag"><img src="${esc(adpulseMark)}" alt=""><span>AdPulse</span><b style="color:#FDE047">${esc(sLabel)}</b></div>
        <div class="adpulse-pin-body" style="background:${c}"><img src="${esc(adpulseMark)}" alt="AdPulse"></div>
      </div>`,
      iconSize: [74, 48],
      iconAnchor: [37, 46],
      popupAnchor: [0, -44]
    });
    const m = L.marker([+s.lat, +s.lng], { icon });
    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.lat+','+s.lng)}&travelmode=driving`;
    
    const popHtml = `<div style="min-width:225px;max-width:275px;font-family:var(--body)">
      <div style="display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#1C1A1B,#2D2628);color:#fff;padding:6px 9px;border-radius:8px;margin-bottom:7px;border-left:3.5px solid #D9161D">
        <img src="${esc(adpulseMark)}" alt="AdPulse" style="width:22px;height:22px;border-radius:6px;background:#fff;padding:1.5px;object-fit:contain;flex:none">
        <div style="line-height:1.15;min-width:0;flex:1">
          <div style="font-weight:800;font-size:11.5px;letter-spacing:0.3px;color:#fff">AdPulse OOH Network</div>
          <div style="font-size:9.5px;color:#FCA5A5;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">S#${esc(String(s.sNo||"—"))} · ${esc(s.client||s.brand||"Verified Site")}</div>
        </div>
      </div>
      <div style="position:relative">
        <img src="${esc(thumbOf(s))}" alt="" style="width:100%;height:112px;object-fit:cover;border-radius:7px;margin-bottom:6px;display:block" onerror="phFix(this)">
        <span style="position:absolute;bottom:12px;left:6px;background:rgba(18,16,17,0.86);color:#fff;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800;display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(217,22,29,0.7)"><img src="${esc(adpulseMark)}" alt="" style="width:12px;height:12px;border-radius:50%;background:#fff">AdPulse · ${esc(s.code)}</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:4px">
        <span class="mono" style="font-size:12px;font-weight:800;color:#D9161D">S#${esc(String(s.sNo||""))} · ${esc(s.code)}</span>
        ${pill(s)}
      </div>
      <div style="font-weight:800;font-size:13.5px;color:var(--ink);margin-bottom:2px">${esc(s.location || s.name || s.title || s.area)}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:3px"><b>${esc(s.area)}</b> · ${sizeOf(s)} ft (${esc(String(s.sqft||((+s.widthFt||0)*(+s.heightFt||0))))} SQFT) · ${esc(s.excelMedium||s.media||"Hoarding")}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${esc(s.from||"—")} → ${esc(s.towards||"—")}</div>
      <div style="font-size:11px;color:var(--ink2);margin-bottom:6px;display:flex;justify-content:space-between"><span>Vendor: <b>${esc(s.vendor||"AdPulse IMC")}</b></span>${s.traffic||s.vehiclesDay?`<span>~${fmtK(otsOf(s))} OTS/d</span>`:""}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px">
        <button class="btn sm pri" data-act="site" data-id="${s.id}" style="justify-content:center;padding:5px 0">Open site</button>
        <a class="btn sm cy" href="${navUrl}" target="_blank" rel="noopener" style="justify-content:center;padding:5px 0;text-decoration:none" title="Start Live GPS Navigation">${ICON.pin}Navigate</a>
        <button class="btn sm pri" onclick="openStreetView3D('${s.id}')" style="grid-column:1/-1;justify-content:center;padding:6px 0;font-size:12px;font-weight:800;background:linear-gradient(135deg,#D9161D,#F26A21);border:0;color:#fff;box-shadow:0 3px 10px rgba(217,22,29,0.45)" title="Open 360° Road Street View with AdPulse Site Overlay">🛣️ 360° Street View &amp; AdPulse Site</button>
        <button class="btn sm" onclick="zoomToSite3D('${s.id}')" style="grid-column:1/-1;justify-content:center;padding:5px 0;font-size:11.5px;font-weight:700;background:linear-gradient(135deg,#7C3AED,#2563EB);border:0;color:#fff" title="Zoom & Inspect directly on this map">🔍 3D Satellite Zoom Here</button>
      </div>
    </div>`;
    m.bindPopup(popHtml, { maxWidth: 280 });
    m.addTo(map);
    markers.push(m);
    _mapMarkerList.push({ marker: m, site: s });
  });

  if(markers.length){
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.15), { maxZoom: 15 });
  } else {
    map.setView([24.8607, 67.0011], 12);
  }

  setTimeout(() => { if(_leafletMap === map) map.invalidateSize(); }, 250);
  renderRidersOnMap();
}

function switchSv3DMode(mode, lat, lng) {
  const ifr = document.getElementById("sv3DIframe");
  const grid = document.getElementById("sv3DMainGrid");
  const pane = document.getElementById("svSplitPhotoPane");
  const card = document.getElementById("svFloatingBillboardCard");
  ["Pano","Split","Sat"].forEach(k => {
    const b = document.getElementById("btnSvMode" + k);
    if (b) b.classList.toggle("on", k.toLowerCase() === mode);
  });
  if (mode === "sat") {
    if (ifr) ifr.src = `https://maps.google.com/maps?q=${lat},${lng}&hl=en&z=19&t=h&output=embed`;
    if (grid) grid.style.gridTemplateColumns = "1fr";
    if (pane) pane.style.display = "none";
    if (card) card.style.display = "block";
  } else if (mode === "split") {
    if (ifr) ifr.src = `https://maps.google.com/maps?q=${lat},${lng}&hl=en&z=19&t=k&output=svembed`;
    if (grid) grid.style.gridTemplateColumns = "1.15fr 0.85fr";
    if (pane) pane.style.display = "flex";
    if (card) card.style.display = "none";
  } else {
    if (ifr) ifr.src = `https://maps.google.com/maps?q=${lat},${lng}&hl=en&z=19&t=k&output=svembed`;
    if (grid) grid.style.gridTemplateColumns = "1fr";
    if (pane) pane.style.display = "none";
    if (card) card.style.display = "block";
  }
}

const BEF = { cat: "all", q: "", vendor: "", view: "table" };

function getBookedExpireSites() {
  return S.sites.filter(s => {
    const avail = String(s.excelAvailability || s.availability || "").trim();
    const st = String(s.excelStatus || s.statusLabel || "").trim();
    const isSubjAvail = /^subject to avail/i.test(avail) && !/WILL BE END|ISSUE/i.test(st);
    return !isSubjAvail || s.status === "booked";
  });
}

                <td class="mono" contenteditable="plaintext-only" spellcheck="false" data-tbledit="${s.id}:vendorEnd" style="border:1px solid #D4D4D8;padding:7px 10px;text-align:center;font-weight:800;color:#D9161D;cursor:text;white-space:nowrap">${esc(s.vendorEndDate||"")}</td>
                <td style="border:1px solid #D4D4D8;padding:7px 8px;text-align:center"><div class="row" style="gap:4px;justify-content:center;flex-wrap:nowrap"><button class="btn sm" onclick="openStreetView3D('${s.id}')" style="padding:4px 7px;font-size:10.5px;font-weight:800;background:#18181B;color:#fff" title="360 Street View & Site">🛣️ 360°</button><button class="btn sm pri" data-act="siteedit" data-id="${s.id}" style="padding:4px 8px;font-size:10.5px;font-weight:700">✏️ Edit</button></div></td>

  return pgTop(
    "Booked Expire Sites",
    `${allBooked.length} Active Booked & Expiring OOH Sites · Track Campaign End Dates, Vendor Expiry & Renewal Status`,

}


/* ============ OOH Assistant (Site Information & Inventory Assistant) ============ */
const OOHSiteAIChatbot = {
  voiceOn: false,
  isListening: false,
  widgetOpen: false,
  messages: [],

  quickQuestions: [
    "📊 All Sites & Inventory Summary",
    "🟢 Available OOH Sites",
    "🔴 Expiring (Will Be End) Sites",
    "🛣️ Nagan Flyover & Shahrah-e-Faisal Sites",
    "📢 All 8 Active Campaigns",
    "🏢 Vendor-Wise Sites Breakdown",
    "🌊 Clifton & DHA Sites",
    "🔢 Sites S#1 to S#10 Details"
  ],

  init() {
    if (this.messages.length === 0) {
      const mCount = (S.sites || []).length || 84;
      const vpCount = (typeof getVendorPreviewSites === "function" ? getVendorPreviewSites() : (window.VENDOR_PREVIEW_SITES_2026 || [])).length || 2199;
      const cCount = (S.campaigns || []).length || 8;
      this.messages.push({
        role: "bot",
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        html: `
          <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:6px">Assalam-o-Alaikum! 👋 Welcome to <b>AdPulse OOH Assistant</b></div>
          <div style="font-size:13px;margin-bottom:6px">Search or ask for complete details on any OOH site, campaign, or vendor inventory:</div>
          <ul style="margin:4px 0 6px 18px;padding:0;font-size:12.6px">
            <li><b>${mCount} OOH AdPulse Sites</b> (S#1 – S#${mCount}, sizes, SQFT, clients, dates &amp; 360° street view)</li>
            <li><b>59 Booked &amp; Expiring Sites</b> (28 <code>WILL BE END</code>, <code>EXTENDABLE</code> &amp; <code>DEPT ISSUE</code>)</li>
            <li><b>${cCount} Active Client Campaigns</b> (AA Avenue, Askari, Chase Value, Eminent, Falaknaz, GFS, Kifayah)</li>
            <li><b>${vpCount.toLocaleString()} Vendors Sites Preview</b> (52 Vendor Decks)</li>
          </ul>
        `,
        sites: []
      });
    }
    this.mountFloatingWidget();
  },

  mountFloatingWidget() {
    if (document.getElementById("aiChatFabBtn")) return;
    const fab = document.createElement("button");
    fab.id = "aiChatFabBtn";
    fab.className = "ai-chat-fab";
    fab.type = "button";
    fab.title = "Open OOH Assistant";
    fab.onclick = () => this.toggleWidget();
    fab.innerHTML = `
      <img src="${esc(markSrc())}" alt="AdPulse">
      <span>💬 OOH Assistant</span>
    `;
    document.body.appendChild(fab);

    const drw = document.createElement("div");
    drw.id = "aiChatFloatingDrawer";
    drw.className = "ai-chat-drawer";
    document.body.appendChild(drw);
    this.renderFloatingDrawer();
  },

  toggleWidget(forceState) {
    this.init();
    this.widgetOpen = typeof forceState === "boolean" ? forceState : !this.widgetOpen;
    const drw = document.getElementById("aiChatFloatingDrawer");
    const fab = document.getElementById("aiChatFabBtn");
    if (drw) {
      drw.classList.toggle("open", this.widgetOpen);
      if (fab) fab.style.display = this.widgetOpen ? "none" : "flex";
      if (this.widgetOpen) {
        this.renderFloatingDrawer();
        setTimeout(() => {
          const inp = document.getElementById("aiFloatInput");
          if (inp) inp.focus();
        }, 80);
      }
    }
  },

  speak(text) {
    if (!this.voiceOn || !("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      const cleanTxt = String(text || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      const u = new SpeechSynthesisUtterance(cleanTxt.slice(0, 420));
      u.lang = "en-PK";
      u.rate = 1.03;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  },

  toggleVoice() {
    this.voiceOn = !this.voiceOn;
    if (!this.voiceOn && "speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    toast(this.voiceOn ? "🔊 Voice Audio Enabled" : "🔇 Voice Audio Muted");
    this.refreshUI();
  },

  startMic(inputId) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      toast("Voice microphone browser mein supported nahi hai — please type karein.");
      return;
    }
    try {
      const rec = new SR();
      rec.lang = "en-US";
      rec.interimResults = false;
      this.isListening = true;
      this.refreshUI();
      toast("🎙️ Listening...");
      rec.onresult = (e) => {
        const txt = e.results[0][0].transcript;
        const inp = document.getElementById(inputId);
        if (inp) inp.value = txt;
        this.isListening = false;
        this.ask(txt);
      };
      rec.onerror = () => { this.isListening = false; this.refreshUI(); };
      rec.onend = () => { this.isListening = false; this.refreshUI(); };
      rec.start();
    } catch (e) {
      this.isListening = false;
      this.refreshUI();
    }
  },

  clearChat() {
    this.messages = [];
    this.init();
    this.refreshUI();
    toast("💬 Chat cleared!");
  },

  openProposalFromSites(ids, title) {
    const cleanIds = (ids || []).filter(id => S.sites.some(s => s.id === id));
    if (!cleanIds.length) {
      toast("Presentation Studio ke liye Master OOH sites select honi chahiye.");
      return;
    }
    Studio.open({ type: "selection", ids: cleanIds }, title || "OOH Site Proposal (2026)");
    this.toggleWidget(false);
  },

  ask(rawQuery) {
    const q = String(rawQuery || "").trim();
    if (!q) return;
    this.init();

    const nowTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    this.messages.push({
      role: "user",
      time: nowTime,
      text: q
    });

    const reply = this.generateHumanReply(q);
    this.messages.push({
      role: "bot",
      time: nowTime,
      html: reply.html,
      sites: reply.sites || [],
      deckTitle: reply.deckTitle || "Selected OOH Sites"
    });

    this.refreshUI();
    this.speak(reply.speech || reply.html);
  },

  generateHumanReply(query) {
    const q = query.toLowerCase().trim().replace(/ch[ae]nab/g, "chinab");
    const masterSites = S.sites || [];
    const vpSites = typeof getVendorPreviewSites === "function" ? getVendorPreviewSites() : (window.VENDOR_PREVIEW_SITES_2026 || []);
    const campaigns = S.campaigns || [];
    const allBooked = typeof getBookedExpireSites === "function" ? getBookedExpireSites() : masterSites.filter(s => s.status === "booked");
    const willEndSites = masterSites.filter(s => /WILL BE END/i.test(s.excelStatus || s.statusLabel || ""));
    const extendableSites = masterSites.filter(s => /EXTENDABLE/i.test(s.excelStatus || s.statusLabel || ""));
    const deptIssueSites = masterSites.filter(s => /ISSUE/i.test(s.excelStatus || s.statusLabel || ""));
    const availSites = masterSites.filter(s => effStatus(s) === "available" || /subject to avail/i.test(s.excelAvailability || s.availability || ""));

    // 1. Check for Site Serial Number range or single S#
    const rangeMatch = q.match(/s#?\s*(\d{1,2})\s*(?:se|to|-|tak)\s*s?#?\s*(\d{1,2})/i);
    if (rangeMatch) {
      const fromNo = Math.min(+rangeMatch[1], +rangeMatch[2]);
      const toNo = Math.max(+rangeMatch[1], +rangeMatch[2]);
      const matched = masterSites.filter(s => +s.sNo >= fromNo && +s.sNo <= toNo);
      return {
        html: `<b>OOH AdPulse Sites S#${fromNo} – S#${toNo}</b> (${matched.length} sites):`,
        sites: matched,
        deckTitle: `AdPulse OOH Sites S#${fromNo}-S#${toNo}`,
        speech: `Showing AdPulse sites S number ${fromNo} to ${toNo}.`
      };
    }

    const sNoMatch = q.match(/(?:\bs#\s*(\d{1,2})\b|\bsite\s*#?\s*(\d{1,2})\b|\bkhi-s0*(\d{1,2})\b)/i);
    if (sNoMatch) {
      const num = +(sNoMatch[1] || sNoMatch[2] || sNoMatch[3]);
      const s = masterSites.find(x => +x.sNo === num || String(x.code || "").toLowerCase() === `khi-s${String(num).padStart(2, "0")}`);
      if (s) {
        const loc = s.location || s.name || s.area || "Karachi";
        const avail = s.excelAvailability || s.availability || STATUS[effStatus(s)];
        const st = s.excelStatus || s.statusLabel || "VERIFIED";
        return {
          html: `
            <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:4px">📍 Site S#${s.sNo} (${esc(s.code)}) — ${esc(loc)}</div>
            <ul style="margin:6px 0 8px 18px;padding:0;font-size:12.8px">
              <li><b>Location &amp; Facing:</b> ${esc(loc)} (${esc(s.from || "—")} → ${esc(s.towards || "—")})</li>
              <li><b>Current Client / Campaign:</b> <b style="color:#D9161D">${esc(s.client || s.brand || "Available")}</b></li>
              <li><b>Media &amp; Dimensions:</b> ${esc(s.excelMedium || s.media || "Hoarding")} · <b>${s.widthFt} × ${s.heightFt} ft</b> (<b>${s.sqft || ((+s.widthFt||0)*(+s.heightFt||0))} SQFT</b>)</li>
              <li><b>Booking Duration:</b> ${esc(s.startDate || "—")} to ${esc(s.endDate || "—")} (${esc(String(s.day || "30"))} Days)</li>
              <li><b>Availability &amp; Expiry Status:</b> <b>${esc(avail)}</b> · <span style="color:#EA580C;font-weight:800">${esc(st)}</span></li>
              <li><b>Vendor &amp; Vendor Ending Date:</b> ${esc(s.vendor || "AdPulse")} (Ends: <b>${esc(s.vendorEndDate || "—")}</b>)</li>
              <li><b>GPS Coordinates:</b> <code>${s.lat}, ${s.lng}</code> (~<b>${fmtK(otsOf(s))} OTS/day</b>)</li>
            </ul>
          `,
          sites: [s],
          deckTitle: `Site S#${s.sNo} - ${loc}`,
          speech: `Site S number ${s.sNo} at ${loc} is a ${s.widthFt} by ${s.heightFt} feet ${s.media} for client ${s.client || "Available"}.`
        };
      }
    }

    // 2. Greeting / Full System Summary
    if (/^(hi|hello|salam|assalam|aoa|hey|help|summary|overview|system|poora|kya hai|all sites)/i.test(q) || q.includes("summary")) {
      const vendors = [...new Set(masterSites.map(s => s.vendor).filter(Boolean))];
      const vpVendors = [...new Set(vpSites.map(s => s.vendor).filter(Boolean))];
      const totalSqft = masterSites.reduce((sum, s) => sum + (+s.sqft || ((+s.widthFt||0)*(+s.heightFt||0))), 0);
      return {
        html: `
          <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:6px">📊 AdPulse OOH Tracking System — Inventory Summary</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0">
            <div style="background:var(--surface);padding:9px 11px;border-radius:10px;border-left:3.5px solid #D9161D">
              <div style="font-size:11px;color:var(--muted);font-weight:700">OOH ADPULSE SITES</div>
              <div style="font-size:18px;font-weight:800;color:var(--ink)">${masterSites.length} Sites</div>
              <small style="color:var(--muted)">${totalSqft.toLocaleString()} Total SQFT</small>
            </div>
            <div style="background:var(--surface);padding:9px 11px;border-radius:10px;border-left:3.5px solid #059669">
              <div style="font-size:11px;color:var(--muted);font-weight:700">AVAILABLE</div>
              <div style="font-size:18px;font-weight:800;color:#059669">${availSites.length} Sites</div>
              <small style="color:var(--muted)">Ready for booking</small>
            </div>
            <div style="background:var(--surface);padding:9px 11px;border-radius:10px;border-left:3.5px solid #EA580C">
              <div style="font-size:11px;color:var(--muted);font-weight:700">BOOKED &amp; EXPIRING</div>
              <div style="font-size:18px;font-weight:800;color:#EA580C">${allBooked.length} Sites</div>
              <small style="color:var(--muted)">${willEndSites.length} Will Be End · ${extendableSites.length} Extendable</small>
            </div>
            <div style="background:var(--surface);padding:9px 11px;border-radius:10px;border-left:3.5px solid #7C3AED">
              <div style="font-size:11px;color:var(--muted);font-weight:700">VENDORS PREVIEW</div>
              <div style="font-size:18px;font-weight:800;color:#7C3AED">${vpSites.length.toLocaleString()} Sites</div>
              <small style="color:var(--muted)">${vpVendors.length} Decks · ${campaigns.length} Campaigns</small>
            </div>
          </div>
          <div style="font-size:12.5px"><b>Active Vendors (${vendors.length}):</b> ${vendors.map(v => esc(v)).join(" · ")}</div>
          <div style="font-size:12.5px;margin-top:4px"><b>Active Campaigns (${campaigns.length}):</b> ${campaigns.map(c => `<b>${esc(c.client)}</b> (${(c.siteIds||[]).length} sites)`).join(", ")}</div>
        `,
        sites: masterSites.slice(0, 6),
        deckTitle: "AdPulse OOH Master Overview (2026)",
        speech: `AdPulse OOH System currently tracks ${masterSites.length} master OOH sites, ${availSites.length} available sites, ${allBooked.length} booked and expiring sites, and ${campaigns.length} active client campaigns.`
      };
    }

    // 3. Campaign Queries
    if (q.includes("campaign") || q.includes("campagin") || q.includes("aa avenue") || q.includes("askari") || q.includes("chase value") || q.includes("eminent") || q.includes("falaknaz") || q.includes("indus valley") || q.includes("gfs") || q.includes("kifayah")) {
      const matchedCamp = campaigns.find(c => {
        const cname = (c.name + " " + c.client).toLowerCase();
        return (q.includes("aa avenue") && cname.includes("aa avenue")) ||
               (q.includes("askari") && cname.includes("askari")) ||
               (q.includes("chase") && cname.includes("chase")) ||
               (q.includes("eminent") && cname.includes("eminent")) ||
               (q.includes("falaknaz") && cname.includes("falaknaz")) ||
               (q.includes("indus") && cname.includes("indus")) ||
               (q.includes("gfs") && !q.includes("indus") && cname.includes("gfs builders")) ||
               (q.includes("kifayah") && cname.includes("kifayah"));
      });

      if (matchedCamp) {
        const cSites = (matchedCamp.siteIds || []).map(id => siteOf(id)).filter(Boolean);
        return {
          html: `
            <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:4px">📢 Campaign: ${esc(matchedCamp.client)} (${cSites.length} Sites)</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn sm pri" data-act="camppresentation" data-id="${matchedCamp.id}" onclick="OOHSiteAIChatbot.toggleWidget(false)">📊 Open ${esc(matchedCamp.client)} Presentation</button>
              <button class="btn sm" data-act="campsites" data-id="${matchedCamp.id}" onclick="OOHSiteAIChatbot.toggleWidget(false)">🏙️ View All ${cSites.length} Sites</button>
            </div>
          `,
          sites: cSites,
          deckTitle: `${matchedCamp.client} - Campaign 2026`,
          speech: `Campaign ${matchedCamp.client} has ${cSites.length} active OOH sites.`
        };
      }

      const campRows = campaigns.map((c, idx) => {
        const cnt = (c.siteIds || []).length;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;gap:8px">
          <div><b>${idx + 1}. ${esc(c.client)}</b> <small style="color:var(--muted)">(${cnt} Sites)</small></div>
          <button class="btn sm pri" data-act="camppresentation" data-id="${c.id}" onclick="OOHSiteAIChatbot.toggleWidget(false)" style="padding:3px 9px;font-size:11px">📊 Open Deck</button>
        </div>`;
      }).join("");
      return {
        html: `
          <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:6px">📢 Active Client Campaigns (${campaigns.length})</div>
          <div style="margin-top:6px">${campRows}</div>
        `,
        sites: masterSites.filter(s => s.status === "booked").slice(0, 6),
        deckTitle: "All Active Client Campaigns 2026",
        speech: `There are ${campaigns.length} active client campaigns in the system.`
      };
    }

    // 4. Expiry / Will Be End / Booked Expire Sites Queries
    if (q.includes("expir") || q.includes("will be end") || q.includes("khatam") || q.includes("ending") || q.includes("extendable") || q.includes("dept issue") || q.includes("hold")) {
      let targetList = allBooked;
      let title = `Booked & Expiring Sites (${allBooked.length})`;
      if (q.includes("will be end") || q.includes("expir") || q.includes("khatam")) {
        targetList = willEndSites;
        title = `🔴 Expiring Sites — WILL BE END (${willEndSites.length})`;
      } else if (q.includes("extendable")) {
        targetList = extendableSites;
        title = `🟢 Extendable Booking Sites (${extendableSites.length})`;
      } else if (q.includes("issue") || q.includes("dept") || q.includes("hold")) {
        targetList = deptIssueSites;
        title = `⚠️ Dept Issue / Hold Sites (${deptIssueSites.length})`;
      }

      const topLines = targetList.slice(0, 10).map(s =>
        `<li><b>S#${s.sNo} (${esc(s.code)})</b> — <b>${esc(s.location || s.name)}</b> · Client: <b style="color:#D9161D">${esc(s.client || s.brand)}</b> · End: <b>${esc(s.endDate || s.excelAvailability || "—")}</b> · Status: <code>${esc(s.excelStatus || s.statusLabel || "BOOKED")}</code> · Vendor End: <b>${esc(s.vendorEndDate || "—")}</b></li>`
      ).join("");

      return {
        html: `
          <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:4px">📅 ${title}</div>
          <ul style="margin:6px 0 8px 18px;padding:0;font-size:12.2px">${topLines}</ul>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
            <button class="btn sm pri" onclick="location.hash='booked-expire';go('booked-expire',true);OOHSiteAIChatbot.toggleWidget(false)">📅 Open Booked Expire Sites Tab (${allBooked.length})</button>
          </div>
        `,
        sites: targetList.slice(0, 8),
        deckTitle: title,
        speech: `Found ${targetList.length} booked and expiring sites.`
      };
    }

    // 5. Available / Khali Sites Queries
    if (q.includes("available") || q.includes("khali") || q.includes("free") || q.includes("vacant") || q.includes("subject to avail")) {
      let filteredAvail = availSites;
      const areaKeywords = ["clifton", "dha", "defense", "faisal", "karsaz", "nagan", "nazimabad", "hyderi", "gulshan", "johar", "university", "rashid minhas", "tariq road", "saddar", "korangi", "malir", "airport", "ii chundrigar", "chundrigar", "seaview", "boat basin", "jail", "hassan square", "nipa"];
      const hitArea = areaKeywords.find(a => q.includes(a));
      if (hitArea) {
        filteredAvail = availSites.filter(s => [s.location, s.name, s.area, s.from, s.towards, s.client].join(" ").toLowerCase().includes(hitArea));
      }
      const listToUse = filteredAvail.length ? filteredAvail : availSites;
      const sampleBullets = listToUse.slice(0, 10).map(s =>
        `<li><b>S#${s.sNo} (${esc(s.code)})</b> — <b>${esc(s.location || s.name)}</b> (${s.widthFt}×${s.heightFt} ft · ${esc(s.excelMedium || s.media)}) · Vendor: <b>${esc(s.vendor || "AdPulse")}</b></li>`
      ).join("");
      return {
        html: `
          <div style="font-weight:800;font-size:14.5px;color:#059669;margin-bottom:4px">🟢 Available OOH Sites (${listToUse.length} Sites${hitArea ? " in " + hitArea.toUpperCase() : ""})</div>
          <ul style="margin:6px 0 8px 18px;padding:0;font-size:12.2px">${sampleBullets}</ul>
        `,
        sites: listToUse.slice(0, 8),
        deckTitle: "Available OOH AdPulse Sites (2026)",
        speech: `There are ${listToUse.length} available OOH sites ready for booking.`
      };
    }

    // 6. Vendor Queries
    if (q.includes("vendor") || q.includes("saturday") || q.includes("preview") || q.includes("ad solution") || q.includes("printech") || q.includes("outdoor") || q.includes("media") || q.includes("chinab")) {
      const masterVendors = {};
      masterSites.forEach(s => { const v = s.vendor || "AdPulse IMC"; masterVendors[v] = (masterVendors[v] || 0) + 1; });
      const vpVendors = {};
      vpSites.forEach(s => { const v = s.vendor || "Vendor"; vpVendors[v] = (vpVendors[v] || 0) + 1; });

      const allVNames = [...Object.keys(masterVendors), ...Object.keys(vpVendors)];
      const matchedV = allVNames.find(v => q.includes(v.toLowerCase().split("(")[0].trim().toLowerCase()) && v.toLowerCase().split("(")[0].trim().length > 3);
      if (matchedV && !q.includes("vendor-wise") && !q.includes("breakdown") && !q.includes("all vendor")) {
        const baseV = matchedV.toLowerCase().split("(")[0].trim();
        const mList = masterSites.filter(s => (s.vendor || "").toLowerCase().includes(baseV));
        const vpList = vpSites.filter(s => (s.vendor || "").toLowerCase().includes(baseV));
        const showSites = [...mList, ...vpList].slice(0, 8);
        return {
          html: `
            <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:4px">🏢 Vendor: ${esc(matchedV)}</div>
            <ul style="margin:6px 0 8px 18px;padding:0;font-size:12.5px">
              <li><b>OOH AdPulse Sites:</b> ${mList.length} sites</li>
              <li><b>Vendors Sites Preview:</b> ${vpList.length} sites</li>
            </ul>
          `,
          sites: showSites,
          deckTitle: `${matchedV} - OOH Inventory`,
          speech: `Vendor ${matchedV} has ${mList.length} master sites and ${vpList.length} preview sites.`
        };
      }

      const mRows = Object.entries(masterVendors).sort((a,b)=>b[1]-a[1]).map(([v,c]) => `<li><b>${esc(v)}:</b> ${c} Sites</li>`).join("");
      const vpTop = Object.entries(vpVendors).sort((a,b)=>b[1]-a[1]).slice(0, 10).map(([v,c]) => `<li><b>${esc(v)}:</b> ${c} Preview Sites</li>`).join("");
      return {
        html: `
          <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:4px">🏢 Vendor-Wise OOH Inventory</div>
          <div><b>1. OOH AdPulse Master Vendors (${masterSites.length} Sites):</b></div>
          <ul style="margin:4px 0 8px 18px;padding:0;font-size:12.2px">${mRows}</ul>
          <div><b>2. Vendors Sites Preview — ${Object.keys(vpVendors).length} Decks (${vpSites.length.toLocaleString()} Sites):</b></div>
          <ul style="margin:4px 0 8px 18px;padding:0;font-size:12.2px">${vpTop}</ul>
        `,
        sites: masterSites.slice(0, 6),
        deckTitle: "Master Vendor-Wise Inventory",
        speech: `We have ${Object.keys(masterVendors).length} master vendors across 84 sites and ${Object.keys(vpVendors).length} vendor preview decks.`
      };
    }

    // 7. General Keyword / Area / Road / Client / Size Search
    const stopWords = new Set(["ka", "ki", "ke", "ko", "se", "mein", "mai", "par", "per", "hai", "hain", "ho", "aur", "and", "or", "the", "in", "on", "at", "for", "of", "to", "show", "tell", "batao", "dikhao", "details", "detail", "site", "sites", "ooh", "adpulse", "billboard", "billboards", "kaunsi", "konsi", "kitni", "kahan", "where", "what", "which", "all", "list", "please", "mujhe", "hamari"]);
    const tokens = q.replace(/[^a-z0-9\s#-]/gi, " ").split(/\s+/).filter(t => t.length >= 2 && !stopWords.has(t));

    const scoreSite = (s) => {
      const hay = [
        s.sNo ? "s#" + s.sNo : "",
        s.code,
        s.location,
        s.name,
        s.title,
        s.area,
        s.from,
        s.towards,
        s.client,
        s.brand,
        s.vendor,
        s.excelMedium,
        s.media,
        s.widthFt + "x" + s.heightFt,
        s.excelAvailability,
        s.availability,
        s.excelStatus,
        s.statusLabel,
        s.vendorEndDate,
        s.endDate
      ].filter(Boolean).join(" ").toLowerCase();

      let score = 0;
      for (const tk of tokens) {
        if (hay.includes(tk)) {
          score += 3;
          if ((s.location || s.name || "").toLowerCase().includes(tk)) score += 4;
          if ((s.client || s.brand || "").toLowerCase().includes(tk)) score += 4;
          if ((s.area || "").toLowerCase().includes(tk)) score += 3;
        }
      }
      return score;
    };

    const scoredMaster = masterSites
      .map(s => ({ s, score: scoreSite(s) }))
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score || (a.s.sNo || 999) - (b.s.sNo || 999))
      .map(x => x.s);

    const scoredVp = vpSites
      .map(s => ({ s, score: scoreSite(s) }))
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .map(x => x.s);

    if (scoredMaster.length > 0 || scoredVp.length > 0) {
      const combined = [...scoredMaster, ...scoredVp.slice(0, 6)];
      const topBullets = scoredMaster.slice(0, 8).map(s =>
        `<li><b>S#${s.sNo} (${esc(s.code)})</b> — <b>${esc(s.location || s.name)}</b> (${s.widthFt}×${s.heightFt} ft · ${esc(s.excelMedium || s.media)}) · Client: <b style="color:#D9161D">${esc(s.client || s.brand || "—")}</b> · Status: <b>${esc(s.excelAvailability || s.availability || STATUS[effStatus(s)])}</b> · Vendor: ${esc(s.vendor || "AdPulse")}</li>`
      ).join("");

      const vpBullets = scoredVp.slice(0, 4).map(s =>
        `<li><b>[Preview] ${esc(s.code)}</b> — <b>${esc(s.location || s.name)}</b> (${s.widthFt}×${s.heightFt} ft) · Vendor: <b>${esc(s.vendor)}</b></li>`
      ).join("");

      return {
        html: `
          <div style="font-weight:800;font-size:14.5px;color:#D9161D;margin-bottom:4px">🔍 Results for "${esc(query)}"</div>
          ${topBullets ? `<div style="font-weight:700;font-size:12.2px;margin-top:4px;color:var(--ink)">🏙️ OOH AdPulse Sites (${scoredMaster.length}):</div><ul style="margin:4px 0 8px 18px;padding:0;font-size:12.1px">${topBullets}</ul>` : ""}
          ${vpBullets ? `<div style="font-weight:700;font-size:12.2px;margin-top:4px;color:#7C3AED">🖼️ Vendors Sites Preview (${scoredVp.length}):</div><ul style="margin:4px 0 8px 18px;padding:0;font-size:12.1px">${vpBullets}</ul>` : ""}
        `,
        sites: combined.slice(0, 8),
        deckTitle: `Search - ${query}`,
        speech: `Found ${scoredMaster.length} OOH sites and ${scoredVp.length} vendor preview sites matching ${query}.`
      };
    }

    // 8. Clean Fallback
    return {
      html: `
        <div style="font-weight:800;font-size:14px;color:#D9161D;margin-bottom:4px">💬 OOH Assistant — Quick Search Guide</div>
        <ul style="margin:6px 0 8px 18px;padding:0;font-size:12.4px">
          <li><b>By Site Number:</b> <code>S#44</code> or <code>S#1 to S#10</code></li>
          <li><b>By Road / Location:</b> <code>Nagan Flyover</code>, <code>Shahrah-e-Faisal</code>, <code>Clifton</code>, <code>DHA</code>, <code>Nazimabad</code></li>
          <li><b>By Client / Campaign:</b> <code>GFS Builders</code>, <code>Chase Value</code>, <code>Kifayah</code>, <code>AA Avenue</code>, <code>Falaknaz</code></li>
          <li><b>By Status:</b> <code>Available sites</code> or <code>Will Be End expiring sites</code></li>
        </ul>
      `,
      sites: masterSites.slice(0, 4),
      deckTitle: "Featured OOH AdPulse Sites",
      speech: "Search by site number S1 to S84, road name, client campaign, or expiring sites."
    };
  },

            ${isVp

              : `<button type="button" class="btn sm" data-act="site" data-id="${s.id}" style="justify-content:center;padding:4px 6px;font-size:10.5px;font-weight:700">👁️ Details</button>
                 <button type="button" class="btn sm" data-act="siteedit" data-id="${s.id}" style="justify-content:center;padding:4px 6px;font-size:10.5px;font-weight:700">✏️ Edit</button>`

    `;

function filtered(){

  return pool.filter(s=>(!F.area||s.area===F.area)&&(!F.size||sizeOf(s)===F.size)&&(!F.media||s.media===F.media||s.excelMedium===F.media)&&(!F.status||F.status==="archived"||effStatus(s)===F.status||(F.status==="booked"&&effStatus(s)==="expiring"))&&(!F.lit||s.light===F.lit)&&(!F.traffic||s.traffic===F.traffic)&&(!F.vendor||s.vendor===F.vendor)&&(!F.campaign||(campOf(F.campaign)?.siteIds||[]).includes(s.id))&&(!q||[s.sNo,s.code,s.name,s.title,s.location,s.client,s.brand,s.medium,s.excelMedium,s.media,s.area,s.from,s.towards,s.vendor,s.vendorEndDate,s.availability,s.excelAvailability,s.statusLabel,s.excelStatus,s.rates,s.notes].join(" ").toLowerCase().includes(q))).sort((a,b)=>(a.sNo||999)-(b.sNo||999)||(a.code||"").localeCompare(b.code||""));
}
function buildClientSummaryRows(list){
  const counts = new Map();
  list.forEach(s => {
    const k = (s.client || s.brand || "UNASSIGNED").trim();
    counts.set(k, (counts.get(k) || 0) + 1);
  });
  if (list.length === 84 && window.MASTER_EXCEL_SUMMARY_2026 && !window._customSummaryEdited) return window.MASTER_EXCEL_SUMMARY_2026;
  return [...counts.entries()].map(([summary, qty], idx) => ({ sNo: idx + 1, summary, qty }));
}
function parseAnyDate(str){
  if(!str)return null;
  const s=String(str).trim();
  const months=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  let m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{2,4})/);
  if(m){let d=+m[1],mo=+m[2]-1,y=+m[3];if(y<100)y+=2000;return new Date(Date.UTC(y,mo,d))}
  m=s.match(/(\d{1,2})[\-\/\s]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[\-\/\s]+(\d{2,4})/i);
  if(m){let d=+m[1],mo=months.indexOf(m[2].slice(0,3).toLowerCase()),y=+m[3];if(y<100)y+=2000;return new Date(Date.UTC(y,mo,d))}
  return null;
}
function applyInlineTableEdit(siteId, field, rawVal){
  const s = S.sites.find(x => x && x.id === siteId);
  if (!s) return null;
  const val = String(rawVal ?? "").trim();
  if (field === "sNo") { s.sNo = parseInt(val, 10) || s.sNo; }
  else if (field === "client") { s.client = s.brand = val; window._customSummaryEdited = true; }
  else if (field === "medium") { s.excelMedium = s.medium = val.toUpperCase(); s.media = val; }
  else if (field === "location") { s.location = s.name = s.title = val; }
  else if (field === "w") {
    s.width = s.widthFt = parseFloat(val) || s.widthFt || 0;
    s.sqft = Math.round((+s.widthFt || 0) * (+s.heightFt || 0));
    s.excelSqft = String(s.sqft);
  }
  else if (field === "h") {
    s.height = s.heightFt = parseFloat(val) || s.heightFt || 0;
    s.sqft = Math.round((+s.widthFt || 0) * (+s.heightFt || 0));
    s.excelSqft = String(s.sqft);
  }
  else if (field === "sqft") {
    s.sqft = /^\d+$/.test(val) ? parseInt(val, 10) : val;
    s.excelSqft = val;
  }
  else if (field === "startDate") {
    s.startDate = s.bookedFrom = val;
    const d1 = parseAnyDate(s.startDate), d2 = parseAnyDate(s.endDate);
    if (d1 && d2 && d2 >= d1) s.day = String(Math.max(1, Math.round((d2 - d1) / 86400000)));
  }
  else if (field === "endDate") {
    s.endDate = s.bookedTill = val;
    const d1 = parseAnyDate(s.startDate), d2 = parseAnyDate(s.endDate);
    if (d1 && d2 && d2 >= d1) s.day = String(Math.max(1, Math.round((d2 - d1) / 86400000)));
  }
  else if (field === "avail") {
    s.availability = s.excelAvailability = val;
    s.status = /subject to avail/i.test(val) ? "available" : "booked";
  }
  else if (field === "status") {
    s.statusLabel = s.excelStatus = val;
  }
  else if (field === "day") {
    s.day = val;
  }
  else if (field === "vendor") {
    s.vendor = val;
  }
  else if (field === "vendorEnd") {
    s.vendorEndDate = val;
  }
  if (Studio.cfg && Studio.cfg.sitesData) {
    const cs = Studio.cfg.sitesData.find(x => x && x.id === siteId);
    if (cs) Object.assign(cs, s);
  }
  persistLocal();
  if (S.mode === "live" && db) put("sites", s).catch(() => {});
  return s;
}

function card(s){
  const n=(s.photos||[]).length;
  const siteTitle=s.location||s.name||s.title||s.area;
  const availVal=s.excelAvailability||s.availability||"";
  const stVal=s.excelStatus!==undefined?s.excelStatus:(s.statusLabel||"");
  const medVal=(s.excelMedium||s.medium||s.media||"HOARDING").toUpperCase();
  const sqftVal=s.excelSqft||s.sqft||((+s.widthFt||0)*(+s.heightFt||0))||"";
  const isArch = !!s.archived;
  return`<article class="card scard ${sel.has(s.id)?"sel":""} ${isArch?"is-archived":""}" data-act="${isArch?"":"site"}" data-id="${s.id}">
  <div class="ph"><img src="${esc(thumbOf(s))}" alt="${esc(s.code)} photo" loading="lazy" data-sid="${s.id}" onerror="phFix(this)">${isArch?`<span class="tag" style="position:absolute;top:8px;left:8px;background:#D9161D;color:#fff;font-weight:800;font-size:11px;z-index:3;padding:3px 8px;border-radius:6px">🗑️ Deleted</span>`:pill(s)}<button class="ck" data-act="${isArch?"none":"sel"}" data-id="${s.id}" aria-label="Select">${sel.has(s.id)?ICON.check:""}</button>${n?`<span class="cnt">${mediaCount(s)}</span>`:""}</div>
  <div class="bd">
    <div class="row" style="gap:6px;align-items:center;margin-bottom:2px">
      <span class="code">S#${esc(String(s.sNo||"—"))} · ${esc(s.code)}</span>
      <span class="tag" style="background:var(--surface2);font-weight:700;color:var(--violet)">${esc(s.area)}</span>
      ${isArch?`<span class="tag" style="background:rgba(217,22,29,0.1);color:#D9161D;font-weight:800;margin-left:auto">In Bin</span>`:(stVal?`<span class="tag" style="background:rgba(217,22,29,0.1);color:#D9161D;font-weight:800;margin-left:auto">${esc(stVal)}</span>`:"")}
    </div>
    <h3 title="${esc(siteTitle)}" style="margin:2px 0 4px;font-size:15.5px;line-height:1.3">${esc(siteTitle)}</h3>
    <div class="dir">${esc(s.from||"—")} ${ICON.arrow} ${esc(s.towards||"—")}</div>
    <div style="font-size:12px;font-weight:700;color:var(--ink);margin:5px 0 2px;display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span style="color:#D9161D">CLIENT:</span> <span>${esc(s.client||s.brand||"—")}</span></div>
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin:2px 0;display:flex;align-items:center;justify-content:space-between;gap:6px">
      <span>Availibilty: <b style="color:var(--ink)">${esc(availVal||"—")}</b></span>
    </div>
    <div style="font-size:11.5px;font-weight:600;color:var(--muted);margin:2px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:6px">
      <span>Vendor: <b style="color:var(--ink)">${esc(s.vendor||"—")}</b></span>
      ${s.vendorEndDate?`<span class="mono" style="color:#D9161D;font-weight:700">End: ${esc(s.vendorEndDate)}</span>`:""}
    </div>
    <div class="meta"><span class="tag mono" style="font-weight:700">${sizeOf(s)} ft (${esc(String(sqftVal))} SQFT)</span><span class="tag" style="font-weight:700">${esc(medVal)}</span></div>
    ${isArch?`<button type="button" class="btn pri sm" data-act="restoresite" data-id="${s.id}" style="margin-top:8px;width:100%;justify-content:center;font-weight:700;background:#10B981">♻️ Restore Site to Master</button>`:""}
  </div></article>`;

        if($("#sd-lat")) $("#sd-lat").value = (+gps[0]).toFixed(6);

    };
  }

        id: uid(),

        url: val,
        tag: "Web Photo",
        kind: "photo",
        at: new Date().toISOString(),
        by: ls.get("sitesnap-name","Office") || "Office"
      };
      d.photos.push(photoObj);
      d.photo = val;
      const galEl = $(".db .gallery");
      if(galEl){

          <img src="${esc(val)}" alt="Site Photo" style="max-height:260px;width:100%;object-fit:cover;border-radius:10px">
          <figcaption>Web Photo · Attached</figcaption>
        </figure>`;
      }

      if(statusEl) statusEl.textContent = "✓ Image link attached!";
      toast("Image URL attached to site");
    };
  }

  if(edit)bindSiteForm($("#siteForm"),d);
}

function wireForm(root,p,d){
  const g=id=>$(`#${p}-${id}`,root);
  const syncBooked=()=>$$("[data-booked]",root).forEach(e=>e.hidden=d.status!=="booked");syncBooked();
  if(g("area")) g("area").onchange=e=>{if(g("newareaL")) g("newareaL").hidden=e.target.value!=="__new"};
  if(g("sizes")) g("sizes").onclick=e=>{const b=e.target.closest("[data-size]");if(!b)return;$$(".chip",g("sizes")).forEach(c=>c.classList.toggle("on",c===b));const v=b.dataset.size;if(g("custom")) g("custom").hidden=v!=="custom";if(v!=="custom"){const[w,h]=v.split("x");if(g("w")) g("w").value=w;if(g("h")) g("h").value=h}};
  if(g("light")) g("light").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;$$(".chip",g("light")).forEach(c=>c.classList.toggle("on",c===b));d.light=b.dataset.v;otsLive()};
  if(g("status")) g("status").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;$$(".chip",g("status")).forEach(c=>c.classList.toggle("on",c===b));d.status=b.dataset.v;syncBooked()};
  if(g("gm")) g("gm").oninput=e=>{const v=e.target.value.trim();if(!v)return;const c=parseCoords(v);if(c){setCoords(p,root,c[0],c[1],"Location read");e.target.value=""}else if(/goo\.gl|maps\.app/i.test(v))toast("Short share links can't be opened here. In Google Maps, tap the blue dot and copy the numbers instead.")};
  if(g("lat") && g("lng")){ g("lat").oninput=g("lng").oninput=()=>gpsLine(p,root); gpsLine(p,root); }
  const lv=g("tlev");
  if(lv) lv.onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;const on=d.traffic===b.dataset.v;d.traffic=on?"":b.dataset.v;$$("button",lv).forEach(x=>x.classList.toggle("on",!on&&x===b));if(g("veh")) g("veh").placeholder=(d.traffic&&tcfg()[d.traffic])?"≈ "+tcfg()[d.traffic].toLocaleString("en-US")+" (estimate)":(d.traffic?"≈ "+(tcfg().vhigh||120000).toLocaleString("en-US")+" (estimate)":"Traffic count, if surveyed");otsLive()};
  const multi=(id,key)=>{const el=g(id);if(!el)return;el.onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;b.classList.toggle("on");d[key]=$$(".chip.on",el).map(x=>x.dataset.v)}};
  multi("peak","peak");
  const otsLive=()=>{
    const tmp={traffic:d.traffic,vehiclesDay:g("veh")?(+g("veh").value||0):0,signal:g("signal")?g("signal").checked:false,light:d.light};
    const o=otsOf(tmp);const box=g("ots");if(!box)return;
    box.innerHTML=o?`<div><b>~${fmtK(o)}</b></div><small>Estimated daily OTS (opportunities to see)<br>${fmtK(vehOf(tmp))} vehicles × ${tcfg().occ} people${/non/i.test(d.light||"")?` × ${tcfg().unlit}% (non-lit)`:""}${tmp.signal?` + ${tcfg().signal}% signal`:""}</small>`:`<small>Pick a traffic level or enter a vehicle count to see estimated daily OTS.</small>`;
  };
  if(g("veh")) g("veh").oninput=otsLive;
  if(g("signal")) g("signal").onchange=otsLive;
  otsLive();
}

function parseCoords(v){let m;
  if(m=v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))return[+m[1],+m[2]];
  if(m=v.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/))return[+m[1],+m[2]];
  if(m=v.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/))return[+m[1],+m[2]];
  if(m=v.match(/(\d{1,2})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NS])[\s,]+(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EW])/i)){const a=(+m[1]+m[2]/60+m[3]/3600)*(/s/i.test(m[4])?-1:1),b=(+m[5]+m[6]/60+m[7]/3600)*(/w/i.test(m[8])?-1:1);return[a,b]}
  if(m=v.match(/(-?\d{1,2}\.\d+)°?\s*([NS])?[\s,]+(-?\d{1,3}\.\d+)°?\s*([EW])?/i)){let a=+m[1],b=+m[3];if(/s/i.test(m[2]||""))a=-a;if(/w/i.test(m[4]||""))b=-b;if(Math.abs(a)<=90&&Math.abs(b)<=180)return[a,b]}
  return null}
function setCoords(p,root,la,lo,msg){const g=id=>$(`#${p}-${id}`,root||document);if(!g("lat"))return;g("lat").value=(+la).toFixed(6);g("lng").value=(+lo).toFixed(6);const near=nearestArea([+la,+lo]);const ar=g("area");if(near&&ar&&ar.value!==near&&p==="cp"){ar.value=near;msg+=` · area set to ${near}`}gpsLine(p,root);toast(msg);if(p==="cp"){AG.idx=0;renderSiteAgent()}}
function gpsLine(p,root){const g=id=>$(`#${p}-${id}`,root||document);const el=g("gpsl");if(!el)return;const la=parseFloat(g("lat").value),lo=parseFloat(g("lng").value);
  el.innerHTML=isFinite(la)&&isFinite(lo)?`<span class="ok">● Location set</span><span class="mono">${la.toFixed(5)}, ${lo.toFixed(5)}</span><a href="https://www.google.com/maps?q=${la},${lo}" target="_blank" rel="noopener" style="color:var(--violet)">Check on map ↗</a>`:`<span>● No location yet. It fills in by itself when a photo carries GPS.</span>`}

function bindSiteForm(form,d){
  wireForm(form,"sd",d);
  form.onsubmit=async e=>{
    e.preventDefault();
    const n=readForm(form,"sd",d);
    if(d.photos && d.photos.length){
      n.photos = d.photos.slice();
    }
    const manualPhotoUrl = ($("#sd-photourl")?.value || "").trim();
    if(manualPhotoUrl && (!n.photos || !n.photos.some(p => p.url === manualPhotoUrl || p.src === manualPhotoUrl))){
      if(!n.photos) n.photos = [];
      n.photos.unshift({
        id: uid(),
        src: manualPhotoUrl,
        url: manualPhotoUrl,
        at: new Date().toISOString(),
        by: ls.get("sitesnap-name","Office") || "Office",
        tag: "Main Photo"
      });
    }
    // Upload files to assets if in live mode
    for(const p of (n.photos||[])){
      if(p.file && S.mode === "live" && assets){
        try{
          const up = await uploadBlob(p.file, p.file.type || "image/jpeg");
          p.asset = up.asset;
        }catch(err){
          console.warn("[OTS] Photo asset upload fallback:", err);
        }
      }
      delete p.file;
    }
    if(n.photos && n.photos.length){
      n.photo = photoSrc(n.photos[n.photos.length-1]) || n.photos[0].src || n.photos[0].url;
    }
    if(!n.lat&&AREAS[n.area]){n.lat=AREAS[n.area][0];n.lng=AREAS[n.area][1];n.approx=true}
    if(form.dataset.new){n.code=nextCode(n.area);n.createdAt=new Date().toISOString()}
    try{
      await put("sites",n);
      const sIdx=S.sites.findIndex(x=>x.id===n.id);
      if(sIdx>=0)S.sites[sIdx]=n;else S.sites.push(n);
      S.sites.sort((a,b)=>(a.sNo||999)-(b.sNo||999));
      toast(form.dataset.new?`Created ${n.code} successfully`:"Saved changes successfully");
      openSite(n.id);
      render(true);
    }catch(err){toast("Couldn't save: "+(err.message||err.code))}
  };
}

      sh.done=true;
      uploadedCount++;
    }
    await put("sites",job.site);
    const sIdx=S.sites.findIndex(x=>x.id===job.site.id);
    if(sIdx>=0)S.sites[sIdx]=JSON.parse(JSON.stringify(job.site));
    else S.sites.unshift(JSON.parse(JSON.stringify(job.site)));

      await put("campaigns",{...camp,siteIds:[...(camp.siteIds||[]),job.site.id]});

    return true;

    return false;
  }
}

/* ============ Auto-Upscale & Clarity Filter ============ */
function enhanceCanvasSharpness(ctx, w, h, amount = 0.24) {
  try {
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    const copy = new Uint8ClampedArray(d);
    const a = amount;
    const center = 1 + 4 * a;
    const rowBytes = w * 4;
    for (let y = 1; y < h - 1; y++) {
      const rowOffset = y * rowBytes;
      for (let x = 1; x < w - 1; x++) {
        const idx = rowOffset + (x * 4);
        for (let c = 0; c < 3; c++) {
          const val = center * copy[idx + c]
            - a * (copy[idx - 4 + c] + copy[idx + 4 + c] + copy[idx - rowBytes + c] + copy[idx + rowBytes + c]);
          d[idx + c] = val < 0 ? 0 : (val > 255 ? 255 : val);
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);
  } catch(err) {
    console.warn("[OTS] Sharpness enhancement note:", err);
  }
}

async function autoUpscaleImage(source, opts = {}) {
  try {
    const minEdge = opts.minEdge || 2048;
    const maxEdge = opts.maxEdge || 2560;
    const targetEdge = opts.targetEdge || 2200;
    const quality = opts.quality || 0.92;
    const doSharpen = opts.sharpen !== false;

    let src = "";
    let cleanup = false;
    if (typeof source === "string") {
      src = source;
    } else if (source instanceof Blob || source instanceof File) {
      src = URL.createObjectURL(source);
      cleanup = true;
    }
    if (!src) return source;

    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.crossOrigin = "anonymous";
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("Image load failed for upscaling"));
      i.src = src;
    });
    if (cleanup) URL.revokeObjectURL(src);

    const nw = img.naturalWidth || img.width || 1200;
    const nh = img.naturalHeight || img.height || 900;
    const curMax = Math.max(nw, nh);

    let sc = 1;
    if (curMax < minEdge) {
      sc = Math.min(3.0, targetEdge / curMax);
    } else if (curMax > maxEdge) {
      sc = maxEdge / curMax;
    }

    const w = Math.round(nw * sc);
    const h = Math.round(nh * sc);

    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, w, h);

    if (doSharpen && (sc >= 1.05 || curMax <= 1920)) {
      enhanceCanvasSharpness(ctx, w, h, sc > 1.3 ? 0.28 : 0.20);
    }

    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", quality));
    return blob || source;
  } catch(err) {
    console.warn("[OTS] autoUpscaleImage note:", err);
    return source;
  }
}

async function watermark(sh,site,camp,who){
  try{
    let src = sh.url;
    let cleanupUrl = false;
    if(!src && sh.file){
      src = URL.createObjectURL(sh.file);
      cleanupUrl = true;
    }
    if(!src) return sh.file;
    const img=await new Promise((r,j)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>r(i);i.onerror=()=>j(new Error("Couldn't load photo"));i.src=src});
    if(cleanupUrl) URL.revokeObjectURL(src);

    const nw = img.naturalWidth || img.width || 1200;
    const nh = img.naturalHeight || img.height || 900;
    const longEdge = Math.max(nw, nh);

    // Auto-upscale low-res/mobile photos up to 2048px - 2200px long edge for crystal clarity
    let sc = 1;
    if (longEdge < 2048) {
      sc = Math.min(2.5, 2048 / longEdge);
    } else if (longEdge > 2560) {
      sc = 2400 / longEdge;
    }
    const w = Math.round(nw * sc), h = Math.round(nh * sc);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = "high";
    x.drawImage(img, 0, 0, w, h);

    // Apply auto-upscale sharpness & clarity boost (brings out crisp billboard typography and edges)
    if (sc >= 1.05 || longEdge <= 1920) {
      enhanceCanvasSharpness(x, w, h, sc > 1.3 ? 0.28 : 0.20);
    }

    // Clean photo without any numbers or words stamped on it
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));
    return blob || sh.file;
  }catch(err){
    console.warn("[OTS] Photo processing fallback:", err);
    return sh.file;
  }
}
/* minimal EXIF GPS reader */
async function exifGPS(file){
  const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<v.byteLength-4){const m=v.getUint16(o);const len=v.getUint16(o+2);if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10;const le=v.getUint16(t)===0x4949;const u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
    const ifd0=t+u32(t+4);let gpsOff=0;for(let i=0,n=u16(ifd0);i<n;i++){const e=ifd0+2+i*12;if(u16(e)===0x8825)gpsOff=t+u32(e+8)}if(!gpsOff)return null;
    const tags={};for(let i=0,n=u16(gpsOff);i<n;i++){const e=gpsOff+2+i*12,tag=u16(e),type=u16(e+2);if(tag===1||tag===3)tags[tag]=String.fromCharCode(v.getUint8(e+8));if((tag===2||tag===4)&&type===5){const p=t+u32(e+8);const r=k=>u32(p+k*8)/u32(p+k*8+4);tags[tag]=r(0)+r(1)/60+r(2)/3600}if(tag===0x11&&type===5){const p=t+u32(e+8);const dn=u32(p+4);if(dn)tags.h=u32(p)/dn}}
    if(tags[2]==null||tags[4]==null)return null;const la=tags[2]*(tags[1]==="S"?-1:1),lo=tags[4]*(tags[3]==="W"?-1:1);return(la||lo)?[la,lo,tags.h!=null&&isFinite(tags.h)?tags.h%360:null]:null}
    if((m&0xFF00)!==0xFF00)break;o+=2+len}return null
}

/* ============ Clear All Previous Data & PPT/PDF Deck Importer ============ */
async function clearAllData(skipConfirm) {
  const doWipe = async () => {
    toast("🗑️ Removing all previous data…");
    try {
      const sites = [...S.sites];
      for (const s of sites) {
        try { await del("sites", s.id); } catch(e) { console.warn(e); }
      }
      const camps = [...S.campaigns];
      for (const c of camps) {
        try { await del("campaigns", c.id); } catch(e) { console.warn(e); }
      }
      const decks = [...(S.decks || [])];
      for (const d of decks) {
        try { await del("decks", d.id); } catch(e) { console.warn(e); }
      }
      S.sites = [];
      S.campaigns = [];
      S.decks = [];
      try { localStorage.removeItem("sitesnap-local"); } catch(e) {}
      toast("✅ Sub previous data successfully removed!");
      render(true);
    } catch(err) {
      toast("Couldn't remove all data: " + (err.message || err));
    }
  };

  if (skipConfirm) {
    await doWipe();
  } else {
    confirmBox("⚠️ Are you sure you want to permanently remove ALL previous sites, campaigns, and decks? This cannot be undone.", doWipe, "Delete Everything");
  }
}

async function ensureDeckLibraries() {
  const tasks = [];
  if (!window.JSZip) {
    tasks.push(new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
      s.onload = res;
      s.onerror = () => rej(new Error("Couldn't load JSZip"));
      document.head.appendChild(s);
    }));
  }
  if (!window.pdfjsLib) {
    tasks.push(new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = () => {
        if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        res();
      };
      s.onerror = () => rej(new Error("Couldn't load PDF.js"));
      document.head.appendChild(s);
    }));
  }
  if (tasks.length) await Promise.all(tasks);
  if (window.pdfjsLib && !window.pdfjsLib.GlobalWorkerOptions?.workerSrc) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
}

function parseDeckSiteText(fullText, texts, index) {
  if (!texts || !texts.length) return null;
  const rawJoined = texts.join(" ");
  if (/OOH UPDATED|www\.adpulse\.pk/i.test(rawJoined) && texts.length < 5 && !/SIZE|DIRECTION/i.test(rawJoined)) {
    return null;
  }
  if (/^(NOTE\s*:|THANK\s*YOU|www\.adpulse\.pk)/i.test(rawJoined) && !/SIZE|DIRECTION/i.test(rawJoined)) {
    return null;
  }

  // 1. Title / Location: collect text runs before bottom-strip sections
  let firstSecIdx = texts.findIndex(t => /^(SIZE|DIRECTION|AVAILAB|RATES|MEDIUM)\b/i.test(t));
  let titleParts = [];
  if (firstSecIdx > 0) {
    titleParts = texts.slice(0, firstSecIdx);
  }
  let title = titleParts.join(" ").trim();

  // If title is empty or just keywords (like Slide 19, 20, 32, 36)
  if (!title || /^(SIZE|DIRECTION|AVAILAB|RATES|MEDIUM)$/i.test(title)) {
    const medIdx = texts.findIndex(t => /^(MEDIUM|FLEX|VINYL|BACKLIT)$/i.test(t));
    if (medIdx !== -1) {
      const candidates = [];
      for (let i = medIdx + 1; i < texts.length; i++) {
        const t = texts[i];
        if (!/^(FLEX|VINYL|BACKLIT|NON[\-_ ]?LIT|PKR|RATES)$/i.test(t) && !/\d{1,2}[\s\-_]+(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)|(?:20\d{2})/i.test(t)) {
          candidates.push(t);
        }
      }
      if (candidates.length) {
        title = candidates.join(" ").trim();
      }
    }
  }

  // Fallback to first non-keyword text run if still empty
  if (!title && texts.length) {
    const candidate = texts.find(t => !/^(SIZE|DIRECTION|AVAILAB|TCF|TGT|RATE|PKR|MEDIUM|FLEX|VINYL|BACKLIT)/i.test(t) && !/^\d+/.test(t) && t.length > 3);
    if (candidate) title = candidate;
  }

  title = title.replace(/&amp;/g, "&")
               .replace(/\s*\|\s*/g, " ")
               .replace(/\s+/g, " ")
               .replace(/^(SIZE|DIRECTION|AVAILAB|RATES|MEDIUM)[\s\S]*/i, "")
               .trim();

  if (!title) title = "Site " + index;

  // 2. Size (Width x Height ft)
  let widthFt = 20, heightFt = 40;
  const szMatch = fullText.match(/(?:SIZE\s*\|?\s*)?(\d{2,3})\s*(?:ft|')?\s*(?:\|)?\s*[xX×*]\s*(\d{1,3})\s*(?:ft|')?/i);
  if (szMatch) {
    widthFt = parseInt(szMatch[1], 10);
    heightFt = parseInt(szMatch[2], 10);
  }

  // 3. Direction (From -> Towards)
  let from = "", towards = "";
  const tcfMatch = fullText.match(/TCF\s+([^|]+?)\s+TGT\s+([^|]+?)(?:\s+(?:AVAILAB|RATES|MEDIUM|PKR)|$)/i);
  if (tcfMatch) {
    from = tcfMatch[1].trim();
    towards = tcfMatch[2].trim();
  } else {
    const dirMatch = fullText.match(/DIRECTION\s*\|\s*([^|]+)/i);
    if (dirMatch) {
      const dir = dirMatch[1].trim();
      const facingMatch = dir.match(/facing\s+([^|]+?)\s+to(?:wards)?\s+([^|]+)/i);
      const towardsMatch = dir.match(/towards\s+([^|]+)/i);
      if (facingMatch) {
        from = facingMatch[1].trim();
        towards = facingMatch[2].trim();
      } else if (towardsMatch) {
        towards = towardsMatch[1].trim();
      } else {
        from = dir;
      }
    }
  }
  from = from.replace(/^(TCF|FTCF)\s+/i, "").replace(/TGT[\s\S]*/i, "").trim();
  towards = towards.replace(/^(TGT)\s+/i, "").replace(/\s+(AVAILAB|RATES|MEDIUM|PKR)[\s\S]*/i, "").trim();

  // 4. Exact Availability Text & Normalized Date
  let availRaw = "";
  if (/SUBJECT\s+TO\s+AVAILAB[A-Z]*/i.test(fullText)) {
    availRaw = "Subject to Availability";
  } else {
    const m = fullText.match(/(\d{1,2}(?:\s*(?:st|nd|rd|th))?[\s\-_,]*(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[\s\-_,]*(?:20\d{2}|\d{2})(?:\s*\+\s*EXT)?)/i);
    if (m) {
      availRaw = m[1].replace(/\s+/g, " ").trim();
    }
  }

  let dateStr = "";
  const dtMatch = (availRaw || fullText).match(/(\d{1,2})\s*(?:st|nd|rd|th)?[\s\-_,]*([A-Z]{3})[A-Z]*[\s\-_,]*(\d{2,4})/i);
  if (dtMatch) {
    const day = dtMatch[1].padStart(2, "0");
    const month = DECK_MONTHS[dtMatch[2].toUpperCase()] || "10";
    let year = dtMatch[3];
    if (year.length === 2) year = "20" + year;
    dateStr = `${year}-${month}-${day}`;
  } else {
    const isoMatch = fullText.match(/(20\d{2})[-/](\d{1,2})[-/](\d{1,2})/);
    if (isoMatch) {
      dateStr = `${isoMatch[1]}-${isoMatch[2].padStart(2, "0")}-${isoMatch[3].padStart(2, "0")}`;
    }
  }

  // Rates
  let rates = "PKR";
  if (/USD|\$/i.test(fullText)) rates = "USD";
  else if (/EUR|€/i.test(fullText)) rates = "EUR";
  else if (/PKR|Rs/i.test(fullText)) rates = "PKR";

  // 5. Media & Light
  let media = "Billboard";
  let light = "Lit";
  if (/SMD|Digital/i.test(fullText)) {
    media = "SMD / Digital Screen";
    light = "Digital";
  } else if (/BRIDGE/i.test(title) || /BRIDGE/i.test(fullText)) {
    media = "Bridge Panel";
  } else if (/ROOFTOP/i.test(title) || /ROOFTOP/i.test(fullText)) {
    media = "Rooftop";
  } else if (/WALL\s*WRAP/i.test(fullText)) {
    media = "Wall Wrap";
  } else if (/HOARDING/i.test(fullText)) {
    media = "Hoarding";
  } else if (/POLE\s*SIGN|STREAMER/i.test(fullText)) {
    media = "Pole Sign / Streamer";
  } else if (/BUS\s*SHELTER/i.test(fullText)) {
    media = "Bus Shelter";
  }

  if (/BACKLIT/i.test(fullText)) {
    light = "Backlit";
  } else if (/NON[\s\-_]?LIT/i.test(fullText)) {
    light = "Non-lit";
  }

  // 6. Area Detection (Karachi)
  const combined = `${title} ${from} ${towards} ${fullText}`;
  let area = "Clifton";
  if (/\b(DHA|Phase\s*[1-8]|Ittehad|Sunset|Gizri|Bukhari|Khayaban|Do Darya|Sea View)\b/i.test(combined)) area = "DHA";
  else if (/\b(Clifton|Boat Basin|Teen Talwar|Do Talwar|3 Sword|2 Sword|Ocean Mall|Sasi Town|Schon Circle)\b/i.test(combined)) area = "Clifton";
  else if (/\b(Shahrah[\-_ ]e[\-_ ]Faisal|Shahr[\-_ ]e[\-_ ]Faisal|SEF|Nursery|Ayesha Bawani|FTC|Metropole|Baloch|Kala Pul|FTCF)\b/i.test(combined)) area = "Shahrah-e-Faisal";
  else if (/\b(Karsaz|Stadium|National Stadium|Habib Ibrahim)\b/i.test(combined)) area = "Karsaz";
  else if (/\b(Tariq Road|Dolmen|Liberty)\b/i.test(combined)) area = "Tariq Road";
  else if (/\b(Shaheed[\-_ ]e[\-_ ]Millat|ABL Roundabout|Hill Park)\b/i.test(combined)) area = "Shaheed-e-Millat / PECHS";
  else if (/\b(PECHS|Nursery Signal|Tariq Rd Junction)\b/i.test(combined)) area = "PECHS / Nursery";
  else if (/\b(Saddar|Regal|Empress|Cantt|Atrium)\b/i.test(combined)) area = "Saddar";
  else if (/\b(Chundrigar|I\.I\.|Tower|Merewether)\b/i.test(combined)) area = "I.I. Chundrigar";
  else if (/\b(Gulshan|NIPA|Maskan|Hassan Square|Disco Bakery|University Rd)\b/i.test(combined)) area = "Gulshan-e-Iqbal";
  else if (/\b(Jauhar|Johar|Millennium|Kamran Chowrangi|Continental)\b/i.test(combined)) area = "Gulistan-e-Jauhar";
  else if (/\b(Nazimabad|Hyderi|Five Star|KDA Chowrangi)\b/i.test(combined)) area = "North Nazimabad";
  else if (/\b(North Karachi|Nagan|UP More|4K)\b/i.test(combined)) area = "North Karachi";
  else if (/\b(FB Area|Water Pump|Ayesha Manzil|Karimabad|Sohrab Goth)\b/i.test(combined)) area = "FB Area";
  else if (/\b(Korangi|Expressway|Shan Chowrangi|Crossing|Creek)\b/i.test(combined)) area = "Korangi";
  else if (/\b(Airport|Malir|Jinnah Avenue|Star Gate|Jinnah Terminal)\b/i.test(combined)) area = "Airport / Malir";
  else if (/\b(Super Highway|M\-9|Highway|Baqai|Toll Plaza)\b/i.test(combined)) area = "Super Highway / M-9";
  else if (/\b(SITE|S\.I\.T\.E|Orangi|Habib Bank Chowrangi)\b/i.test(combined)) area = "S.I.T.E. / Orangi";

  return {
    slideIndex: index,
    title,
    name: title,
    area,
    widthFt,
    heightFt,
    from,
    towards,
    date: dateStr,
    availability: availRaw || (dateStr ? dateStr : "Available"),
    rates,
    media,
    light
  };
}

async function parsePptxDeck(file, onProgress) {
  if (!window.JSZip) await ensureDeckLibraries();
  const zip = await window.JSZip.loadAsync(file);
  const slideKeys = Object.keys(zip.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/i.test(k));
  slideKeys.sort((a, b) => {
    const na = parseInt(a.match(/\d+/)[0], 10);
    const nb = parseInt(b.match(/\d+/)[0], 10);
    return na - nb;
  });

  const total = slideKeys.length;
  const sites = [];

  for (let i = 0; i < total; i++) {
    const slidePath = slideKeys[i];
    const slideNum = parseInt(slidePath.match(/\d+/)[0], 10);
    if (onProgress) onProgress(i + 1, total, `Reading slide ${i + 1} of ${total}…`);

    const xml = await zip.files[slidePath].async("text");
    const tMatches = xml.match(/<a:t(?:\s+[^>]*)?>([\s\S]*?)<\/a:t>/g) || [];
    const texts = tMatches.map(m => m.replace(/<[^>]+>/g, "").trim()).filter(Boolean);
    const fullText = texts.join(" ");

    if (i === 0 && (/OOH UPDATED|www\.adpulse\.pk/i.test(fullText) && texts.length < 5)) {
      continue;
    }

    const parsed = parseDeckSiteText(fullText, texts, slideNum);
    if (!parsed) continue;

    try {
      const relsPath = slidePath.replace("ppt/slides/slide", "ppt/slides/_rels/slide") + ".rels";
      if (zip.files[relsPath]) {
        const relsXml = await zip.files[relsPath].async("text");
        const picMatches = [...xml.matchAll(/<p:pic[\s\S]*?<\/p:pic>/g)];
        let targetRelId = null;
        for (const pic of picMatches) {
          const blipM = pic[0].match(/<a:blip[^>]*r:embed="([^"]+)"/);
          if (blipM) { targetRelId = blipM[1]; break; }
        }
        let targetFile = null;
        if (targetRelId) {
          const relM = relsXml.match(new RegExp(`<Relationship[^>]+Id="${targetRelId}"[^>]+Target="([^"]+)"`, "i"));
          if (relM) targetFile = relM[1].replace(/^\.\.\//, "ppt/");
        }
        if (!targetFile || !zip.files[targetFile]) {
          const allMedia = [...relsXml.matchAll(/Target="([^"]*media\/[^"]+)"/g)].map(m => m[1].replace(/^\.\.\//, "ppt/"));
          let maxLen = 0;
          for (const mFile of allMedia) {
            if (zip.files[mFile] && zip.files[mFile]._data && zip.files[mFile]._data.uncompressedSize > maxLen) {
              if (!/\.(emf|wmf)$/i.test(mFile)) {
                maxLen = zip.files[mFile]._data.uncompressedSize;
                targetFile = mFile;
              }
            }
          }
        }
        if (targetFile && zip.files[targetFile]) {
          const imgBlob = await zip.files[targetFile].async("blob");
          parsed.photoBlob = imgBlob;
          parsed.previewUrl = URL.createObjectURL(imgBlob);
        }
      }
    } catch(err) {
      console.warn("Could not extract image for slide " + slideNum, err);
    }

    sites.push(parsed);
  }
  return sites;
}

async function parsePdfDeck(file, onProgress) {
  if (!window.pdfjsLib) await ensureDeckLibraries();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const numPages = pdf.numPages;
  const sites = [];

  for (let i = 1; i <= numPages; i++) {
    if (onProgress) onProgress(i, numPages, `Rendering & reading page ${i} of ${numPages}…`);
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    const texts = textContent.items.map(item => item.str).filter(Boolean);
    const fullText = texts.join(" ");

    if (i === 1 && /OOH UPDATED|AdPulse|OVERVIEW|PORTFOLIO/i.test(fullText) && !/SIZE|DIRECTION|AVAILAB/i.test(fullText)) {
      continue;
    }

    const parsed = parseDeckSiteText(fullText, texts, i);
    if (!parsed) continue;

    try {
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport }).promise;
      const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.85));
      parsed.photoBlob = blob;
      parsed.previewUrl = URL.createObjectURL(blob);
    } catch(e) {
      console.warn("Could not render PDF page to canvas:", e);
    }

    sites.push(parsed);
  }
  return sites;
}

    startDate: today(),

            <select class="in sm" id="pcmVendor" style="min-width:240px;max-width:320px;min-height:42px;padding:6px 10px;font-size:12.5px;font-weight:700;border-radius:10px">
              <option value="">All Vendors / Advertisers (${cVendors.length + 1})</option>
              <option value="__adpulse__" style="font-weight:800;color:#7C3AED">📋 Master File (${masterSites.length} sites)</option>

              <option value="">All Status</option>
              <option value="available">Available Only</option>
              <option value="booked">Date-Locked / Booked</option>
            </select>

            ${renderPickItems()}
          </div>

          <!-- Bottom Action Bar -->
          <div class="row" style="gap:12px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--border);flex:none;background:var(--surface)">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:13px;color:var(--muted);font-weight:700">✨ Click any site to select/deselect</span>
              <span id="pcmStatsSummary" style="font-size:12.5px;font-weight:800;color:#D9161D"></span>
            </div>

            <button type="button" class="btn" id="pcmSaveCampBtn" style="font-weight:800;padding:8px 16px">💾 Save as Proposed Campaign</button>
            <button type="button" class="btn pri" id="pcmGenPptBtn" style="min-width:210px;justify-content:center;font-weight:900;font-size:14px;padding:9px 20px;background:linear-gradient(135deg,#D9161D,#F26A21);box-shadow:0 4px 14px rgba(217,22,29,0.35)">📊 Generate Proposal PPT</button>
